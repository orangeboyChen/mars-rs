# The Kotlin Multiplatform packaging is one small module per platform, but
# Kotlin/Native downloads its compiler and builds a klib per target: 4 GiB.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.nonTransitiveRClass=true

# `mars-ffi` is one C ABI and one header on every target, which is what lets the
# klib cinterop makes of it be commonized: one `marsFFI` for `nativeMain` and
# not thirteen, one per target. It is not an optimisation, it is what
# `nativeMain` is compiled out of — the metadata compilation of an intermediate
# source set has no cinterop of its own, so without commonization every
# `mars_xlog_*` in `Xlog.native.kt` is an unresolved reference in it.
#
# The price is that every cinterop of the module becomes a dependency of every
# target's compilation: a host that can build one archive needs all thirteen to
# build anything, which is why the Linux job downloads the Apple ones.
kotlin.mpp.enableCInteropCommonization=true
