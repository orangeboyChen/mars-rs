# One small app module; 2 GiB is plenty for it.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# An R class that holds only this module's own resources, and not the ones of
# every dependency — one less thing for a demo to pull in.
android.nonTransitiveRClass=true
# Deliberately no `sdk.dir`: it is the one line of a Gradle build that is
# different on every machine, which is what `local.properties` is for and why
# this repository ignores that file. An `ANDROID_HOME` in the environment works
# just as well, and is what CI sets.
