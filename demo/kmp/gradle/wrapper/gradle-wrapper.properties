distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 8.14.3 and not the newest Gradle, which is what `platforms/android` and the
# Android demo are on: the composite build in settings.gradle.kts runs the
# included build *under this one's* Gradle, and `platforms/kmp` is a Gradle 8
# build — AGP 8.13.2, and the Kotlin plugin beside it, do not apply under
# Gradle 9. A composite build cannot bridge the two, so the demo takes the
# version of the build it includes.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
