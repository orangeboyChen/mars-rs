# https://docs.jitpack.io — the Android AAR of mars-rs on JitPack
#
#   implementation 'io.github.orangeboyChen:mars-rs:v0.1.0'
#
# JitPack has an Android SDK but neither an NDK nor a Rust toolchain, so the
# native libraries that .github/workflows/release.yml built are downloaded from
# the release of the same tag before the AAR is assembled — the trick
# orangeboyChen/mars plays as well. What is published is what
# android/mars-xlog/build.gradle.kts says: group io.github.orangeboyChen,
# artifact mars-rs, version $VERSION.

jdk:
  - openjdk21

before_install:
  - 'echo "VERSION=$VERSION GIT_DESCRIBE=$GIT_DESCRIBE"'
  - |
    for V in "$VERSION" "v$VERSION" "$GIT_DESCRIBE"; do
      [ -n "$V" ] || continue
      echo "trying the release assets of $V"
      if curl -sSfL -o mars-android-native.zip \
          "https://github.com/orangeboyChen/mars-rs/releases/download/$V/mars-android-native.zip"; then
        echo "downloaded mars-android-native.zip of $V"
        break
      fi
    done
  - test -s mars-android-native.zip || { echo "could not download mars-android-native.zip"; exit 1; }
  # <abi>/libmarsxlog.so, which is what jniLibs.srcDirs("libs") reads
  - unzip -q -o mars-android-native.zip -d android/mars-xlog/libs
  - find android/mars-xlog/libs -name '*.so' | sort

install:
  - cd android && ./gradlew --no-daemon -PpublishedVersion="$VERSION" :mars-xlog:publishToMavenLocal
