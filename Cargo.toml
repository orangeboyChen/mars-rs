[workspace]
resolver = "2"
members = [
    "crates/mars-core",
    "crates/mars-crypt",
    "crates/mars-buffer",
    "crates/mars-appender",
    "crates/mars-ffi",
    "crates/mars-compat",
    "crates/mars-jni",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Tencent/mars"
authors = ["Mars Rust Working Group"]

[workspace.dependencies]
mars-core = { path = "crates/mars-core" }
mars-crypt = { path = "crates/mars-crypt" }
mars-buffer = { path = "crates/mars-buffer" }
mars-appender = { path = "crates/mars-appender" }

memmap2 = "0.9"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"
k256 = "0.13"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tempfile = "3"
serde_json = "1"
jni = "0.21"
