# The Flutter plugin of the whole port: the one an app takes when it wants more
# than logging. Today more than logging is nothing — the C ABI is 16
# `mars_xlog_*` symbols and nothing else, and `scripts/build_xcframework.sh`
# fails the day it is not — so this plugin and `marsrs_xlog` are the same
# package under two names, and `Xlog` is the class both of them hand out, the
# way `Xlog` is `Xlog` in both AARs of `platforms/android/`. STN and SDT land
# here and in nothing else: `marsrs_xlog` stays the xlog-only plugin,
# the way `platforms/android/marsrs-xlog` is to `platforms/android/marsrs` and
# `MarsRSXlog` to `MarsRS`.
#
#   dependencies:
#     marsrs:
#       path: marsrs           # the directory in the plugin's tarball
#
# `.github/workflows/release.yml` publishes it as
# `marsrs-flutter-<version>.tar.gz` on the release of the same tag, and
# `scripts/package_flutter.sh` is what stamps the version below, the AAR's
# coordinate in `platforms/android/build.gradle.kts`, and drops
# MarsRSXlog.xcframework into `ios/Frameworks`.
#
# Where the two halves get their native from, and why they differ:
#
#   * Android depends on the `marsrs` AAR of the same version, resolved
#     from JitPack — the same coordinate, resolved the same way, as for an app
#     that takes the AAR directly.
#   * iOS carries the framework with it. CocoaPods cannot resolve the SwiftPM
#     binary target of Package.swift, and there is no CocoaPods pod for it, so
#     the release's `MarsRSXlog.xcframework` travels inside the plugin.
#
# Take this one or `marsrs_xlog`, not both: both carry the same
# `libmarsrsxlog.so`, and an app with two of it does not build.

name: marsrs
description: >-
  Flutter plugin for mars-rs, a Rust implementation of Tencent/mars: the whole
  port, xlog today.
version: 0.1.0-alpha.3
homepage: https://github.com/orangeboyChen/mars-rs
repository: https://github.com/orangeboyChen/mars-rs
issue_tracker: https://github.com/orangeboyChen/mars-rs/issues
topics:
  - logging
  - mars
  - xlog

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

platforms:
  android:
  ios:

flutter:
  plugin:
    platforms:
      android:
        package: io.github.orangeboychen.marsrs.flutter
        pluginClass: XlogPlugin
      ios:
        pluginClass: XlogPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
