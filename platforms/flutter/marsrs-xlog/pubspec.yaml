# The Flutter plugin of the xlog half of mars-rs.
#
#   dependencies:
#     marsrs_xlog:
#       path: marsrs-xlog      # the directory in the plugin's tarball
#
# `.github/workflows/release.yml` publishes it as
# `marsrs-flutter-xlog-<version>.tar.gz` on the release of the same tag, and
# `scripts/package_flutter.sh` is what stamps the version below, the AAR's
# coordinate in `platforms/android/build.gradle.kts`, and drops
# MarsRSXlog.xcframework into `ios/Frameworks`.
#
# Where the two halves get their native from, and why they differ:
#
#   * Android depends on the `xlog` AAR of the same version, resolved
#     from JitPack — the same coordinate, resolved the same way, as for an app
#     that takes the AAR directly.
#   * iOS carries the framework with it. CocoaPods cannot resolve the SwiftPM
#     binary target of Package.swift, and there is no CocoaPods pod for it, so
#     the release's `MarsRSXlog.xcframework` travels inside the plugin.
#
# The plugin is named after xlog because xlog is what it wraps: the C ABI is 28
# `mars_xlog_*` symbols and nothing else, and `scripts/build_xcframework.sh`
# fails the day it is not — the same reason the framework is called xlog's, and
# the reason `MarsRSXlog` and the `xlog` AAR are.
#
# The whole port is the `marsrs` plugin, and this is the one for an app
# that only logs — the way `platforms/android/marsrs-xlog` is to
# `platforms/android/marsrs`, and `MarsRSXlog` to `MarsRS`. The two are the
# same package today, because xlog is the whole C ABI; the day STN and SDT
# land in it, they land in `marsrs` and not here.

name: marsrs_xlog
description: >-
  Flutter plugin for xlog, the logging half of mars-rs: a Rust implementation of
  Tencent/mars that writes the .xlog the C++ implementation produced.
version: 0.1.0-alpha.2
homepage: https://github.com/orangeboyChen/mars-rs
repository: https://github.com/orangeboyChen/mars-rs
issue_tracker: https://github.com/orangeboyChen/mars-rs/issues
topics:
  - logging
  - mars
  - xlog

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

platforms:
  android:
  ios:

flutter:
  plugin:
    platforms:
      android:
        package: io.github.orangeboychen.marsrs.xlog.flutter
        pluginClass: XlogPlugin
      ios:
        pluginClass: XlogPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
