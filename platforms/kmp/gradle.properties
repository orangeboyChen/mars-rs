# The Kotlin Multiplatform packaging is one small module per platform, but
# Kotlin/Native downloads its compiler and builds a klib per target: 4 GiB.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Deliberately no `org.gradle.caching`. Kotlin 2.2 marks the compile and the
# link task of a Kotlin/Native target `@CacheableTask`, so the thirteen of this
# module would be written into `~/.gradle/caches/build-cache-1` — which is
# inside what the two Kotlin jobs hand to `actions/cache`, and that step is
# keyed by the configuration: a key GitHub has saved once is a key it does not
# save again, so what a release wrote into the build cache would never leave
# its runner. A key of the run would carry it out, and would carry the
# dependency cache out with it, some 2 GB per job of a release, against the
# 10 GB a repository is given and against every other cache of the same
# release. What that buys is a hit on a release whose `.a` is byte for byte
# the one before it — a release in which no Rust changed.
android.nonTransitiveRClass=true

# `mars-ffi` is one C ABI and one header on every target, which is what lets the
# klib cinterop makes of it be commonized: one `marsFFI` for `nativeMain` and
# not thirteen, one per target. It is not an optimisation, it is what
# `nativeMain` is compiled out of — the metadata compilation of an intermediate
# source set has no cinterop of its own, so without commonization every
# `mars_xlog_*` in `Xlog.native.kt` is an unresolved reference in it.
#
# The price is that every cinterop of the module becomes a dependency of every
# target's compilation: a host that can build one archive needs all thirteen to
# build anything, which is why the Linux job downloads the Apple ones.
kotlin.mpp.enableCInteropCommonization=true
