name: Lint (Swift)

# The Swift gate. The Kotlin one is lint-kotlin.yml and the Rust one lives in
# rust.yml: `rustfmt`, `clippy` with `-D warnings`, and the lints of
# `[workspace.lints]`.
#
# Each of the three gates fails on the first finding. `swiftlint lint --strict`
# turns its warnings into errors, ktlint exits non-zero on any violation, and
# `detekt.yml` sets `build.maxIssues: 0`. None of them is run with a
# `--format`/`--auto-correct` flag, because a gate that rewrites what it checks
# is not a gate.
#
# The versions are pinned and the tools are fetched as release artefacts rather
# than installed by a package manager: Homebrew has no `swiftlint@0.65.1`, and a
# new SwiftLint release brings new rules with it.
#
# It reads `Sources` and its own configuration, and nothing else: a pull
# request that touches only `crates/` or only `android/` has no Swift in it,
# and this is the one gate of the three that has to run on macOS, the host a
# minute of which is billed at ten times a Linux one. Which is why `swiftlint`
# skips when the commit touches neither — see the comment on `changes`.

on:
  # Every run starts, whatever the commit touched: what decides whether the job
  # of it does any work is `changes` below. A job that is skipped answers the
  # ruleset — a skipped check satisfies a requirement — while a run that never
  # started answers nothing at all, and leaves the pull request BLOCKED waiting
  # for a status that is not coming (#108).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A push supersedes the run it interrupts, so the older one is cancelled. A
# push to main is never cancelled — every commit of it gets its own green or
# red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFTLINT_VERSION: '0.65.1'

jobs:
  changes:
    name: What changed (Swift)
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff is against the base of the pull request, which is behind
          # the tip of the branch it was cut from.
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          .github/scripts/changed_paths.sh \
            'Sources/**' '.swiftlint.yml' '.github/scripts/**' \
            '.github/workflows/lint-swift.yml'

  swiftlint:
    name: swiftlint (Swift)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    # The macos image is where the Swift of this package is written for, and the
    # artefact bundle's macos binary is the one for it; the linux binaries need a
    # Swift runtime the ubuntu image does not carry.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # A Swift 6 toolchain is what lints the sources, and it changes nothing
      # about what is shipped: `scripts/build_xcframework.sh` compiles no Swift
      # at all (it runs cargo and then `xcodebuild -create-xcframework`), and
      # Package.swift stays at swift-tools-version 5.9 so that a Swift 5 project
      # can still depend on the package. Raising `swift-tools-version` is what
      # would put the floor at Xcode 16 — not the toolchain doing the linting.
      - name: Swift version
        run: swift --version
      # The tools are run out of the workspace rather than installed into
      # /usr/local/bin, which the runner account cannot write to on ubuntu.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLintBinary.artifactbundle.zip"
          unzip -q swiftlint.zip
          mv SwiftLintBinary.artifactbundle/macos/swiftlint ./swiftlint
          chmod +x ./swiftlint
          ./swiftlint version
      # `.swiftlint.yml` says what is linted (`Sources`) and which opt-in rules
      # run on top of the defaults; `--strict` is what fails the job.
      - run: ./swiftlint lint --strict
