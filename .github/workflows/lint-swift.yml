name: Lint (Swift)

# The Swift gate. The Kotlin one is lint-kotlin.yml and the Rust one lives in
# rust.yml: `rustfmt`, `clippy` with `-D warnings`, and the lints of
# `[workspace.lints]`.
#
# Each of the three gates fails on the first finding. `swiftlint lint --strict`
# turns its warnings into errors, ktlint exits non-zero on any violation, and
# `detekt.yml` sets `build.maxIssues: 0`. None of them is run with a
# `--format`/`--auto-correct` flag, because a gate that rewrites what it checks
# is not a gate.
#
# The versions are pinned and the tools are fetched as release artefacts rather
# than installed by a package manager: Homebrew has no `swiftlint@0.65.1`, and a
# new SwiftLint release brings new rules with it.
#
# It reads `platforms/apple`, the C headers that Swift is written over, its own
# configuration, and nothing else: a pull request that touches only `crates/`
# or only `platforms/android/` has no Swift in it, and this is the one gate of
# the three that has to run on macOS, the host a minute of which is billed at
# ten times a Linux one. Which is why both jobs skip when the commit touches
# neither — see the comment on `changes`.
#
# Two jobs and not one, because they answer different questions: `swiftlint`
# is what the sources look like, and `compile (apple)` is whether they compile
# for iOS and for watchOS. A check keeps the name the ruleset asks it by, so
# the compile is a job of its own rather than a second step of the lint.

on:
  # Every run starts, whatever the commit touched: what decides whether the job
  # of it does any work is `changes` below. A job that is skipped answers the
  # ruleset — a skipped check satisfies a requirement — while a run that never
  # started answers nothing at all, and leaves the pull request BLOCKED waiting
  # for a status that is not coming (#108).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A push supersedes the run it interrupts, so the older one is cancelled. A
# push to main is never cancelled — every commit of it gets its own green or
# red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SWIFTLINT_VERSION: '0.65.1'

jobs:
  changes:
    name: What changed (Swift)
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against the base of the pull request, which is behind
          # the tip of the branch it was cut from.
          fetch-depth: 0
      # `crates/marsrs-ffi/include/**` is in the list because the compile job
      # below writes the module maps it compiles against out of those headers:
      # a symbol the Swift calls that the header no longer declares is a
      # failure of this gate, and not of the release that builds the framework.
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          .github/scripts/changed_paths.sh \
            'platforms/apple/**' '.swiftlint.yml' '.github/scripts/**' \
            'crates/marsrs-ffi/include/**' \
            '.github/workflows/lint-swift.yml'

  swiftlint:
    name: swiftlint (Swift)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    # The macos image is where the Swift of this package is written for, and the
    # artefact bundle's macos binary is the one for it; the linux binaries need a
    # Swift runtime the ubuntu image does not carry.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # A Swift 6 toolchain is what lints the sources, and it changes nothing
      # about what is shipped: `scripts/build_xcframework.sh` compiles no Swift
      # at all (it runs cargo and then `xcodebuild -create-xcframework`), and
      # Package.swift stays at swift-tools-version 5.9 so that a Swift 5 project
      # can still depend on the package. Raising `swift-tools-version` is what
      # would put the floor at Xcode 16 — not the toolchain doing the linting.
      - name: Swift version
        run: swift --version
      # The tools are run out of the workspace rather than installed into
      # /usr/local/bin, which the runner account cannot write to on ubuntu.
      - name: Install SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/SwiftLintBinary.artifactbundle.zip"
          unzip -q swiftlint.zip
          mv SwiftLintBinary.artifactbundle/macos/swiftlint ./swiftlint
          chmod +x ./swiftlint
          ./swiftlint version
      # `.swiftlint.yml` says what is linted (`platforms/apple`) and which
      # opt-in rules run on top of the defaults; `--strict` is what fails the
      # job.
      - run: ./swiftlint lint --strict

  # The other half of the gate, and the half a linter cannot do: whether the
  # Swift compiles for the two platforms the package is published for.
  #
  # `swift build` is not how it is asked, because two of the five targets of
  # Package.swift are binary ones holding a prebuilt iOS and watchOS
  # xcframework: a macOS host links neither, and a pull request would have to
  # download the release asset first. What the script does instead is write
  # module maps over `crates/marsrs-ffi/include` — a C module is all a Swift
  # file takes from either target — and emit every Swift module of the package
  # for three triples: iOS 12 on arm64, and watchOS 10 on `arm64_32` and on
  # `arm64`.
  #
  # Which is the question a pull request was not asked: the release compiles
  # the Swift when it builds the xcframework, so the first compile of a change
  # happened after the merge. A watchOS app got a source that named `UIApplication` — a symbol the watchOS SDK marks unavailable, and
  # one `canImport(UIKit)` answers `true` for on watchOS — and nothing between
  # the pull request and the release said so.
  #
  # A module is emitted rather than the sources being `-typecheck`ed: a type
  # check stops before SILGen, which is where a `self` handed over before the
  # `super.init()` Swift writes for an `NSObject` subclass is caught, and
  # which is the other thing this job found.
  compile:
    name: compile (apple)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    # The SDKs of both platforms are in the Xcode the image carries; a
    # `macos-15` image with no iOS SDK cannot ask the question at all.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - run: .github/scripts/typecheck_swift.sh
