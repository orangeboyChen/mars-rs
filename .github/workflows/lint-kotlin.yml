name: Lint (Kotlin)

# The Kotlin gate. The Swift one is lint-swift.yml and the Rust one lives in
# rust.yml: `rustfmt`, `clippy` with `-D warnings`, and the lints of
# `[workspace.lints]`.
#
# Each of the three gates fails on the first finding. `swiftlint lint --strict`
# turns its warnings into errors, ktlint exits non-zero on any violation, and
# `detekt.yml` sets `build.maxIssues: 0`. None of them is run with a
# `--format`/`--auto-correct` flag, because a gate that rewrites what it checks
# is not a gate.
#
# The versions are pinned and the tools are fetched as release artefacts rather
# than installed by a package manager, so that a new release of either — and
# the new rules it brings — is a change made here on purpose.
#
# It reads `platforms/android/`, `platforms/kmp/` and the Kotlin of the two
# bridging plugins — `platforms/flutter/` and `platforms/react-native/`, whose
# Android halves are Kotlin over the AAR — plus the two configuration files
# the tools are told to use, and nothing else: a pull request that touches
# none of them is not a Kotlin pull request, whatever else it is. So `kotlin`
# skips when the commit touches none of them — see the comment on `changes`.

on:
  # Every run starts, whatever the commit touched: what decides whether the job
  # of it does any work is `changes` below. A job that is skipped answers the
  # ruleset — a skipped check satisfies a requirement — while a run that never
  # started answers nothing at all, and leaves the pull request BLOCKED waiting
  # for a status that is not coming (#108).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A push supersedes the run it interrupts, so the older one is cancelled. A
# push to main is never cancelled — every commit of it gets its own green or
# red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  KTLINT_VERSION: '1.8.0'
  DETEKT_VERSION: '1.23.8'

jobs:
  changes:
    name: What changed (Kotlin)
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against the base of the pull request, which is behind
          # the tip of the branch it was cut from.
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          # `platforms/kmp/**` is the Kotlin Multiplatform build: the same two
          # tools hold it to the same configuration, so it is a Kotlin source
          # tree like `platforms/android/` is. `platforms/flutter/**` and
          # `platforms/react-native/**` are the Android halves of the two
          # plugins, which are Kotlin over the same AAR and are held to it for
          # the same reason.
          .github/scripts/changed_paths.sh \
            'platforms/android/**' 'platforms/kmp/**' 'platforms/flutter/**' \
            'platforms/react-native/**' 'detekt.yml' \
            '.editorconfig' '.github/scripts/**' \
            '.github/workflows/lint-kotlin.yml'

  kotlin:
    name: ktlint + detekt (Kotlin)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # The two of them are fetched in one step because that is all it is: two
      # release artefacts, and one JDK to run the second one with.
      - name: Install ktlint ${{ env.KTLINT_VERSION }} and detekt ${{ env.DETEKT_VERSION }}
        run: |
          set -euo pipefail
          curl -sSfL -o ktlint \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint --version
          curl -sSfL -o detekt-cli-all.jar \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
      # `.editorconfig` is the whole of ktlint's configuration: the
      # `android_studio` code style, the 120-column line and the end-of-file
      # rules. ktlint exits non-zero on any violation. `platforms/kmp/` is the
      # Kotlin Multiplatform build: the same style, and the same
      # `.editorconfig`. `platforms/flutter/` and `platforms/react-native/` are
      # the Android halves of the two plugins, held to it like the rest.
      - run: |
          ./ktlint --relative \
            'platforms/android/**/*.kt' 'platforms/android/**/*.kts' \
            'platforms/kmp/**/*.kt' 'platforms/kmp/**/*.kts' \
            'platforms/flutter/**/*.kt' 'platforms/flutter/**/*.kts' \
            'platforms/react-native/**/*.kt' 'platforms/react-native/**/*.kts'
      # `--build-upon-default-config`: detekt.yml names only what differs from
      # detekt's own defaults, and its `build.maxIssues: 0` is what fails the
      # job. The main sources, and not the test ones: the same line the android
      # modules are held to.
      - run: |
          java -jar detekt-cli-all.jar \
            --input platforms/android/marsrs/src/main/kotlin,platforms/android/marsrs-xlog/src/main/kotlin,platforms/kmp/marsrs/src/commonMain/kotlin,platforms/kmp/marsrs/src/androidMain/kotlin,platforms/kmp/marsrs/src/nativeMain/kotlin,platforms/kmp/marsrs-xlog/src/commonMain/kotlin,platforms/kmp/marsrs-xlog/src/androidMain/kotlin,platforms/kmp/marsrs-xlog/src/nativeMain/kotlin,platforms/flutter/marsrs/android/src/main/kotlin,platforms/flutter/marsrs-xlog/android/src/main/kotlin,platforms/react-native/marsrs/android/src/main/kotlin,platforms/react-native/marsrs-xlog/android/src/main/kotlin \
            --config detekt.yml \
            --build-upon-default-config
