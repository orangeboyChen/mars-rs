name: Lint (Harmony)

# The HarmonyOS gate, beside the Kotlin's (lint-kotlin.yml), the Swift's
# (lint-swift.yml) and the Rust's, which lives in rust.yml.
#
# It reads platforms/harmonyos/ and nothing else: a pull request that touches
# neither the module nor the scripts that check it is not a HarmonyOS pull
# request, whatever else it is. So `harmony` skips when the commit touches none
# of them — see the comment on `changes`.
#
# What it runs is two checks and not `hvigor assembleHar`, and the reason is
# the tool: HarmonyOS's own build is the DevEco Command Line Tools, which is a
# 2 GB download carrying its own Node and SDK, wants a JDK 17 beside it, and
# wants a DevEco *project* around this module — a project root, and an
# `ohpm install` that fetches `@ohos/hvigor-ohos-plugin` out of HarmonyOS's
# registry on every run. That is a lot of runner for the four ArkTS files of a
# package whose .so is already built by rust.yml, and one more registry for a
# gate to depend on. So the ArkTS is checked the two ways it can be checked
# with what a Linux runner has:
#
#   scripts/check_harmony_arkts.sh   the ArkTS read as TypeScript — tsc, and
#                                    the NAPI declarations behind it — which is
#                                    what catches a method `Xlog.ets` calls
#                                    that `index.d.ts` does not declare
#   scripts/check_harmony.sh         the manifests, the three lists of NAPI
#                                    names, and the ArkTS rules tsc does not
#                                    know (no `any`, no `unknown`, no `var`)
#
# Between them they are a gate, and not a build: no ArkTS compiler has run over
# this tree yet, and no app has loaded the module. Both scripts say so.

on:
  # Every run starts, whatever the commit touched: what decides whether the job
  # of it does any work is `changes` below. A job that is skipped answers the
  # ruleset — a skipped check satisfies a requirement — while a run that never
  # started answers nothing at all, and leaves the pull request BLOCKED waiting
  # for a status that is not coming (#108).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A push supersedes the run it interrupts, so the older one is cancelled. A
# push to main is never cancelled — every commit of it gets its own green or
# red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The version the ArkTS is type-checked with, pinned: docs' own is pinned the
  # same way, and a new TypeScript is a new set of rules over a source no
  # HarmonyOS compiler reads.
  TYPESCRIPT_VERSION: '5.9.3'
  NODE_VERSION: '20.19'

jobs:
  changes:
    name: What changed (Harmony)
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against the base of the pull request, which is behind
          # the tip of the branch it was cut from.
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          .github/scripts/changed_paths.sh \
            'platforms/harmonyos/**' \
            'scripts/check_harmony.sh' 'scripts/check_harmony_arkts.sh' \
            'scripts/package_harmony.sh' '.github/scripts/**' \
            '.github/workflows/lint-harmony.yml'

  harmony:
    name: ArkTS and the manifests (Harmony)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `tsc` and nothing else, installed out of the tree: `--prefix` into the
      # runner's temp, because a `node_modules` in the checkout is a `node_modules`
      # the next step's `find` would read, and no `package.json` of this
      # repository asks for TypeScript — the site's does, and this is not the
      # site.
      - name: Install tsc ${{ env.TYPESCRIPT_VERSION }}
        run: npm install --prefix "$RUNNER_TEMP/tsc" --no-save "typescript@$TYPESCRIPT_VERSION"
      # The ArkTS as TypeScript: `.ets` renamed, `libmarsrs_xlog.so` answered
      # out of `index.d.ts`, and `tsc --noEmit` over it.
      - name: Type-check the ArkTS
        env:
          TSC: ${{ runner.temp }}/tsc/node_modules/.bin/tsc
        run: scripts/check_harmony_arkts.sh
      # The rest: the four `json5` manifests, the fields ohpm requires, the
      # NAPI names of the C and of the declarations and of the ArkTS being one
      # list, and the ArkTS rules tsc has never heard of.
      - name: Check the manifests, the names and the rules
        run: scripts/check_harmony.sh
