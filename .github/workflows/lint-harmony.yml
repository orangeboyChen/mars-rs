name: Lint (Harmony)

# The HarmonyOS gate, beside the Kotlin's (lint-kotlin.yml), the Swift's
# (lint-swift.yml) and the Rust's, which lives in rust.yml.
#
# It reads platforms/harmonyos/ and nothing else: a pull request that touches
# neither the module nor the scripts that check it is not a HarmonyOS pull
# request, whatever else it is. So every job here skips when the commit touches
# none of them — see the comment on `changes`.
#
# What runs is one build and two reads, and the two reads are there because the
# build is expensive: HarmonyOS's own ArkTS compiler arrives inside the DevEco
# Command Line Tools, which is a 2.1 GB archive on a mirror that is slow, and a
# `hvigor assembleHar` that wants a DevEco *project* around this module. So:
#
#   assemble  scripts/assemble_harmony_har.sh   DevEco's own `hvigorw` over the
#                                               module — the only ArkTS
#                                               compiler in this repository
#   harmony   scripts/check_harmony_arkts.sh    the ArkTS read as TypeScript
#             scripts/check_harmony.sh          the manifests, the three lists
#                                               of NAPI names, the ArkTS rules
#
# The two reads run in seconds and answer on every commit that touches the
# module, and they are what tells you *which* line is wrong; `assembleHar` is
# what tells you the module still builds, and writes the HAR ohpm publishes —
# the one with `compatibleSdkVersion` in it, which the archive
# scripts/package_harmony.sh assembles by hand does not have.

on:
  # Every run starts, whatever the commit touched: what decides whether the job
  # of it does any work is `changes` below. A job that is skipped answers the
  # ruleset — a skipped check satisfies a requirement — while a run that never
  # started answers nothing at all, and leaves the pull request BLOCKED waiting
  # for a status that is not coming (#108).
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A push supersedes the run it interrupts, so the older one is cancelled. A
# push to main is never cancelled — every commit of it gets its own green or
# red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The version the ArkTS is type-checked with, pinned: docs' own is pinned the
  # same way, and a new TypeScript is a new set of rules over a source no
  # HarmonyOS compiler reads.
  TYPESCRIPT_VERSION: '5.9.3'
  NODE_VERSION: '20.19'
  # DevEco Command Line Tools, the Linux one: `hvigorw`, `codelinter` and
  # `ohpm`, with the OpenHarmony SDK and a Node of their own inside the same
  # archive — which is why nothing here needs `ohpm install` to fetch
  # `@ohos/hvigor-ohos-plugin` out of HarmonyOS's registry.
  DEVECO_CLI_VERSION: '5.1.0.840'
  DEVECO_CLI_URL: >-
    https://repo.huaweicloud.com/openharmony/ohpm/5.1.0/commandline-tools-linux-x64-5.1.0.840.zip
  DEVECO_CLI_SHA256: '1dcefa4741dc289277560b2802040e0c45b433898d8db453d711d5376e0478f1'
  JAVA_VERSION: '17'

jobs:
  changes:
    name: What changed (Harmony)
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against the base of the pull request, which is behind
          # the tip of the branch it was cut from.
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          .github/scripts/changed_paths.sh \
            'platforms/harmonyos/**' \
            'scripts/check_harmony.sh' 'scripts/check_harmony_arkts.sh' \
            'scripts/assemble_harmony_har.sh' 'scripts/fetch_deveco_cli.sh' \
            'scripts/package_harmony.sh' '.github/scripts/**' \
            '.github/workflows/lint-harmony.yml'

  harmony:
    name: ArkTS and the manifests (Harmony)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # `tsc` and nothing else, installed out of the tree: `--prefix` into the
      # runner's temp, because a `node_modules` in the checkout is a `node_modules`
      # the next step's `find` would read, and no `package.json` of this
      # repository asks for TypeScript — the site's does, and this is not the
      # site.
      - name: Install tsc ${{ env.TYPESCRIPT_VERSION }}
        run: npm install --prefix "$RUNNER_TEMP/tsc" --no-save "typescript@$TYPESCRIPT_VERSION"
      # The ArkTS as TypeScript: `.ets` renamed, `libmarsrs_xlog.so` answered
      # out of `index.d.ts`, and `tsc --noEmit` over it.
      - name: Type-check the ArkTS
        env:
          TSC: ${{ runner.temp }}/tsc/node_modules/.bin/tsc
        run: scripts/check_harmony_arkts.sh
      # The rest: the four `json5` manifests, the fields ohpm requires, the
      # NAPI names of the C and of the declarations and of the ArkTS being one
      # list, and the ArkTS rules tsc has never heard of.
      - name: Check the manifests, the names and the rules
        run: scripts/check_harmony.sh

  assemble:
    name: hvigor assembleHar (Harmony)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # hvigor runs on the JVM. The DevEco Command Line Tools carry their own
      # Node — `tool/node/` — and their own SDK, so the JDK is the one thing
      # the runner has to bring.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # The DevEco Command Line Tools, and the reason this job is not the one
      # that takes ten minutes: the archive is 2.1 GB on a mirror whose fast day
      # and slow day are a minute and ten apart, so it is downloaded once and
      # then cached — the way rust.yml caches the OHOS SDK — under a key of the
      # version alone, which is what makes a cache written by a run on main one
      # a pull request can restore. What goes into the cache is a third of a
      # gigabyte and not 2.1: scripts/fetch_deveco_cli.sh unpacks the archive
      # without the two SDK components this build never runs.
      - name: Cache the DevEco Command Line Tools ${{ env.DEVECO_CLI_VERSION }}
        uses: actions/cache@v6
        with:
          path: .deveco-cli
          key: deveco-cli-${{ env.DEVECO_CLI_VERSION }}
      - name: Fetch the DevEco Command Line Tools ${{ env.DEVECO_CLI_VERSION }}
        run: scripts/fetch_deveco_cli.sh .deveco-cli
      # The real thing: DevEco's own ArkTS compiler over this module, and the
      # HAR that comes out of it — the one with `compatibleSdkVersion`,
      # `compatibleSdkType`, `obfuscated` and `nativeComponents` in it, which
      # is what `ohpm publish` looks for and what
      # scripts/package_harmony.sh assembles by hand without.
      - name: Assemble the HAR
        env:
          DEVECO_HOME: ${{ github.workspace }}/.deveco-cli/command-line-tools
        run: scripts/assemble_harmony_har.sh dist
