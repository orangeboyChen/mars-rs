name: Label

# A pull request is labelled by what it touches: `.github/labeler.yml` maps a
# path to a label, and `actions/labeler` reads the map against the diff of the
# pull request. What it never does is guess what a change *meant* — `type: bug`
# against `type: feature` is a claim no path can make, and both are left to a
# person. The comment at the top of the configuration says which families are
# derived and which are not.
#
# The event is `pull_request` and not `pull_request_target`, and that is the one
# line here worth explaining. `pull_request_target` runs in the context of the
# base branch, and so carries a token that can write: that is how a pull
# request opened from a fork could be labelled at all, the token of
# `pull_request` from a fork being one that can only read. GitHub blocks the
# event in a public repository by default from 2 November 2026 unless the
# repository carries an Actions policy that allows it, and what this workflow
# asks for is not worth a policy of its own: no secret, no checkout, no line of
# the pull request run, only a token that may write a label back. A pull
# request opened from a branch of this repository — which is every pull
# request it has had — gets exactly that from `pull_request`.
#
# What it costs is a pull request whose token cannot write, and the job below
# says so out loud rather than failing on one: one opened from a fork, and one
# opened by Dependabot, are skipped — neither could write the label in any
# case. Dependabot's own head is a branch here, but GitHub runs what it opens
# as if it came from a fork, and the token is read-only for the same reason.
#
# What it does not cost is what the old event was chosen for. The workflow
# never checks the pull request out and never runs a line of it — the action
# reads the diff through the API and writes a label back — and a fork cannot
# buy a write by editing this file or the configuration beside it, because a
# fork's pull request is run with a read-only token whichever permissions are
# asked for here.

# This is not one of the checks the ruleset asks for, so a run that does not
# happen cannot leave a pull request waiting for a status that is not coming.
# It is a convenience and not a gate: it holds no merge up.

on:
  pull_request:
    # Labelled when it opens, and again on every push that changes what it
    # touches — which is also what takes a stale one back off. Nothing else:
    # a retitled pull request is not re-labelled.
    types:
      - opened
      - synchronize
      - reopened

# A push supersedes the run it interrupts, and the group is the pull request so
# that it supersedes that one's run and no other's: two pull requests never
# share a group, and never cancel each other's labelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Label by the paths changed
    runs-on: ubuntu-latest
    # A pull request run with a token that cannot write is left unlabelled
    # rather than failed on: a job that asked for a label it had no right to
    # write would be a red run that could never have been green. Two kinds get
    # such a token — one whose head is another repository, and one opened by
    # Dependabot, which GitHub runs as if it came from a fork even though its
    # head is a branch here.
    if: >
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      # The label is written back through the API, which is the whole of what
      # this job does.
      pull-requests: write
      issues: write
    steps:
      # `sync-labels` is on: a label whose paths are no longer touched is
      # taken back off. Without it a pull request that shed its `docs/` half
      # on the way to review would carry `meta: docs-site` and
      # `type: documentation` to the merge — a set of labels describing a
      # diff that is not there any more. Only a push re-runs it, and a push
      # is what re-labelling waits for here: the diff is taken against the
      # merge base, so `main` moving under an open pull request does not
      # shrink it, and the rebase that follows is one. What it never takes
      # off is a name the map does not carry — since the fifth major
      # version the action removes a label only if the map names it, so a
      # `type: bug` or a `type: feature` — the family no path can decide —
      # stays on.
      - uses: actions/labeler@v7
        with:
          sync-labels: true
