name: Rust

# Build / lint / test gate of the xlog workspace: rustfmt, clippy, the test
# suite on Linux/macOS/Windows (debug and release), a release build, cargo doc,
# and the Android, HarmonyOS and Apple cross builds of the FFI and JNI crates.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `--all-features`: the SDT and STN C ABIs are behind features of their
      # own, so a plain `--workspace` never compiles them.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test (release)
        run: cargo test --workspace --release
      # The SDT and STN C ABIs, behind the features an app that only logs
      # leaves off.
      - name: cargo test (sdt)
        run: cargo test -p mars-ffi --features sdt
      - name: cargo test (stn)
        run: cargo test -p mars-ffi --features stn

  build:
    name: build (release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --all-targets

  android:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
      # An exported `RUSTFLAGS` replaces `target.<triple>.rustflags` of
      # .cargo/config.toml instead of extending it, so the 16 KiB page size has
      # to ride along with `-D warnings`. Without it Android 15 devices with
      # 16 KiB pages refuse to load the library.
      RUSTFLAGS: >-
        -D warnings
        -C link-arg=-Wl,-z,max-page-size=16384
        -C link-arg=-Wl,-z,common-page-size=16384
      # The runner image already ships the Android SDK; it is pinned here
      # because the `cargo build` step derives the NDK path from it.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi24-clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `android-actions/setup-android` is intentionally not used: it installs
      # the long-removed `tools` SDK package, so its `sdkmanager` call exits
      # non-zero and the job fails before any Rust code is compiled. The SDK
      # (and its `sdkmanager`) that the runner image already provides is enough
      # to install the NDK.
      - name: Install the Android NDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` is killed by SIGPIPE as soon as sdkmanager stops reading, and
          # under `pipefail` that 141 would fail the job even though sdkmanager
          # itself succeeded. Grouping it keeps the pipeline status to
          # sdkmanager's own exit code.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;${NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
      - uses: Swatinem/rust-cache@v2
      # `zstd-sys` compiles C, so both cc-rs and rustc need the NDK clang. The
      # two of them spell the env var prefixes differently, so the names are
      # built in the shell rather than from `env:`; see the comment below.
      - name: cargo build
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          # `aarch64-linux-android` -> `aarch64_linux_android`
          flat="$(printf '%s' "$target" | tr '-' '_')"
          upper="$(printf '%s' "$flat" | tr '[:lower:]' '[:upper:]')"
          ndk_bin="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$ndk_bin/${{ matrix.clang }}"
          test -x "$clang"
          # Casing matters here and the two prefixes are spelled differently:
          # cargo reads the upper-cased `CARGO_TARGET_<TRIPLE>_LINKER`, while
          # cc-rs reads `CC_<triple>` verbatim (it also tries the underscore
          # form, then `TARGET_CC`, then `CC`). The upper-cased `CC_<TRIPLE>`
          # is silently ignored on Linux, which makes cc-rs fall back to a bare
          # `<triple>-clang` on `$PATH` and fail.
          export "CC_${flat}=$clang"
          export "AR_${flat}=$ndk_bin/llvm-ar"
          export "CARGO_TARGET_${upper}_LINKER=$clang"
          # So that plain `llvm-ar` and friends are reachable too.
          export PATH="$ndk_bin:$PATH"
          cargo build --release -p mars-ffi --target "$target"
          cargo build --release -p mars-jni --target "$target"
          ls -l "target/$target/release/libmarsxlog.so"

  # HarmonyOS. The three OHOS targets are tier 2 with host tools, so a std ships
  # for them and stable is enough; what is gated here is everything the SDK has
  # to answer for instead — its sysroot, the C build of `zstd-sys` against it,
  # and the unwinder rustc asks the linker for, which the SDK keeps beside clang
  # rather than in the sysroot. One job for the three ABIs because the SDK they
  # are built with is 2.7 GB and is downloaded once, not once per ABI.
  harmony:
    name: build (harmony)
    runs-on: ubuntu-latest
    env:
      OHOS_SDK_VERSION: 6.1-Release
      # Outside `target/`, so that the rust cache below does not carry the SDK
      # a second time.
      OHOS_SDK_CACHE: ${{ github.workspace }}/.ohos-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-unknown-linux-ohos
            armv7-unknown-linux-ohos
            x86_64-unknown-linux-ohos
      - name: Cache the OHOS SDK
        uses: actions/cache@v4
        with:
          path: .ohos-sdk
          key: ohos-sdk-${{ env.OHOS_SDK_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build_harmony.sh dist/harmony
      - name: The three libraries a HarmonyOS module carries
        run: ls -l dist/harmony/*/libmars_ffi.so

  apple:
    name: build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          # An arm64 watch is a watchOS 26 watch, and `aarch64-apple-watchos`
          # is what builds for one.
          - aarch64-apple-watchos
          - aarch64-apple-watchos-sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mars-ffi --target ${{ matrix.target }}

  # The watchOS device slice of the xcframework is two architectures, and the
  # older of them is the one a watchOS 10 to 25 app links: `arm64_32` is tier 3,
  # so no channel ships a std for it and the only way to build for it is out of
  # a nightly's sources. It is the same Rust the stable jobs above compile, so
  # what this job is really gating is the tier 3 target itself — a nightly that
  # stops building it fails here and not in the release.
  apple-watchos-arm64-32:
    name: build (arm64_32-apple-watchos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mars-ffi --target arm64_32-apple-watchos -Z build-std=std,panic_abort

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # 90 % of the lines, measured over everything `cargo test` can reach.
      # mars-jni/src/jni_bridge.rs is left out on purpose: it is the JVM
      # boundary and needs a live JNIEnv, so only the Android AAR exercises it.
      # The logic behind those entry points lives in the crate root and *is*
      # measured.
      - name: Measure line coverage
        run: |
          cargo llvm-cov --workspace --all-features --summary-only \
            --ignore-filename-regex 'mars-jni/src/jni_bridge\.rs' \
            --fail-under-lines 90
  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps --all-features
