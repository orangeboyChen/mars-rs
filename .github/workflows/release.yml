name: Release

# One release for every platform:
#
#   * marsrs-xlog.xcframework.zip   -> the xlog binary target of Package.swift
#   * marsrs-net.xcframework.zip    -> the net one (the diagnosis and the tasks)
#   * marsrs-cocoapods-xlog-<version>.zip -> the `MarsRSXlog` pod: the xlog
#                                     framework and the Swift of its module
#   * marsrs-cocoapods-net-<version>.zip  -> the `MarsRSNet` pod, the same pair
#   * marsrs.aar                 -> JitPack: io.github.orangeboychen.marsrs:marsrs
#   * xlog.aar                   -> JitPack: io.github.orangeboychen.marsrs:xlog
#   * marsrs-android-native.zip  -> the .so files, for a consumer's own AAR
#   * marsrs-<version>-<host>.tar.gz / .zip -> the C ABI for Linux/macOS/Windows
#   * marsrs-xlog-cli-<version>-<host>.tar.gz / .zip -> the `xlog` CLI, which
#                              reads and writes those files from a shell
#   * marsrs-kmp-native.zip  -> the archives the Kotlin module is built out of
#   * marsrs-kmp-maven.zip   -> the Kotlin module itself, as a maven repository
#   * marsrs-flutter-<version>.tar.gz / marsrs-flutter-xlog-<version>.tar.gz
#                           -> the two Flutter plugins
#   * marsrs-react-native-<version>.tgz / marsrs-react-native-xlog-<version>.tgz
#                           -> the two React Native modules, named by `npm pack`
#   * marsrs-harmony-<version>.tar.gz -> the three HarmonyOS `.so` files
#   * marsrs-harmonyos-xlog-<version>.har -> the HarmonyOS package, for ohpm
#   * crates.io: `marsrs` and `marsrs-xlog`, at the version of the tag
#
# The four plugin packages are packaged on every release, which is what the docs
# tell a consumer to install while publishing is not switched on. Publishing
# them is optional, and neither registry is given a secret: both take this run's
# OIDC token instead, which is what `id-token: write` is for.
#
#   * npm, from this workflow — the registry exchanges the token for a publish
#     token of its own. What it needs is this repository named as a trusted
#     publisher of the package, which is set on npmjs.com and not here.
#   * pub.dev, from pub.yml: pub.dev rejects a run that is not one of a tag,
#     and this workflow is a `workflow_dispatch` that creates the tag itself, so
#     it hands the publish to a run whose ref is that tag.
#
# No registry is asked in a step that can end the release. What one of them
# answers is about itself and not about the tag, the assets or the other
# registries of the same release, every one of which is assembled by the time it
# is asked; a step that fails is a red step of a green run. The way back is
# publish.yml — Actions -> Publish, with the tag — which publishes the
# registries of a release that is already out, mostly out of the archives it
# carries and with no build of its own.
#
# A package a registry has never seen has no settings to put a trusted publisher
# in, so its first version is published by hand and the release says so rather
# than fail. `CARGO_REGISTRY_TOKEN` is the one credential left, in `crates`.
#
# The two CocoaPods pods are the same shape, one step short of it: packaged on
# every release and published nowhere, because `pod trunk push` takes a token of
# the CocoaPods trunk and this repository does not have one. What an app names
# is the podspec of the tag, and what the podspec names is the asset of the
# release — see the `cocoapods` job.
#
# Everything this port packages itself is named `marsrs`, the way the crates
# are: the two AARs, the archives a consumer downloads, and the group of the
# coordinates — `io.github.orangeboychen.marsrs`, the port — under which the
# artifact is the piece of it: `marsrs` for the whole port, `xlog` for the
# logging half. `mars-core` and `mars-xlog` are the C++ project's pair, and
# nothing of this port's own borrows either — least of all `core`, which here
# is the name of a crate no package is published under.
#
# The steps that outgrew a `run:` block are `.github/scripts/`: no one runs them
# by hand, and they are of a piece with the workflows that call them. `scripts/`
# keeps what a developer runs to build a package — README's "Building the
# packages" is those two.
#
# The Kotlin Multiplatform pair is published to GitHub Packages as well, from
# the `kmp` job. It is one job on macOS and not one per platform, because a
# Kotlin publication is one artifact per Kotlin target of one module: its module
# metadata names all of them, so a publication missing one is a publication an
# app of that platform cannot resolve.
# Trigger it by hand (Actions -> Release -> Run workflow):
#
#   * version: the version, typed out — "1.2.3", "v1.2.3-alpha.1", "0.2.0-beta.2"
#   * bump + prerelease: "the next patch, as the second alpha", which is what
#     the sequence v1.2.4-alpha.1 -> v1.2.4-alpha.2 -> v1.2.4 is made of
#
# The number counts on only while it is that version being worked towards: as
# long as no stable v1.2.4 is out, the next alpha is v1.2.4-alpha.3, and the
# bump is what it would be applied to. A v1.2.4 that *is* out already sends the
# bump to v1.2.5, whose first alpha is v1.2.5-alpha.1 — the number belongs to
# the version, not to the repository.
#
# The tag is the version with a "v" in front: v1.2.3, v1.2.3-alpha.1,
# v1.2.3-beta.2. Anything with a suffix is published as a GitHub pre-release.
# The number is separated from the channel by a dot, the way semver separates
# two identifiers: `beta.10` counts past `beta.9`, whereas the identifier
# `beta10` is compared letter by letter and so sorts *before* `beta2`.
#
# workflow_dispatch only: the tag is created by this workflow itself, so
# pushing one never re-triggers a run.
#
# Package.swift and the three podspecs are updated on a topic branch and
# proposed as a pull request — the default branch refuses direct pushes
# (GH013), the same as in orangeboyChen/mars. The tag and the release are
# published from that branch's commit, so the new Package.swift resolves at the
# tag whether or not the PR has been merged yet.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3, v1.2.3-alpha.1, 0.2.0-beta.2 (overrides the bump)'
        required: false
      bump:
        description: 'Semver bump of the latest tag, when no version is typed'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: 'stable, or a pre-release of the version the bump works out'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - beta
      prerelease:
        description: 'Number only: 2 for alpha.2, 3 for beta.3 … (empty = the next one)'
        required: false

# Two releases at once race over the same tag and over the same
# `chore/package-swift-<tag>` branch, so the second waits for the first instead
# of running beside it — and it is not cancelled, because by the time it starts
# the tag it was going to create may already be out.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run pub.yml`, for the two Flutter plugins: a tag this workflow
  # pushed cannot start a run of its own, so it is asked for instead.
  actions: write
  # `packages: write` is what lets the `kmp` job publish the Kotlin
  # Multiplatform pair to GitHub Packages; the default token of a run that does
  # not ask for it is refused with a 403 at the first `PUT`.
  packages: write

env:
  # The two the Swift package resolves. Lower-case, the way the crates and the
  # Android coordinates are spelled, because a zip is a file a consumer
  # downloads and not a name a compiler reads; the products a manifest names —
  # `MarsRSXlog` and `MarsRSNet`, what an app writes after `import` — are in
  # Package.swift and do not move with the zip.
  XCFRAMEWORK_ZIP: marsrs-xlog.xcframework.zip
  # the same slices over the other feature set: `mars_sdt_*` and `mars_stn_*`
  # and no `mars_xlog_*`, so an app that takes both links xlog's once
  XCFRAMEWORK_NET_ZIP: marsrs-net.xcframework.zip
  # Every archive of this port's own — the natives the two Android AARs and the
  # Kotlin module are assembled from, and the C ABI a host links — takes the
  # crates' spelling, because a zip is a file a consumer downloads and not a
  # name a compiler reads. The two AARs below take it too: what an app writes is
  # a coordinate, and it is `marsrs` on JitPack as it is on crates.io.
  NATIVE_ZIP: marsrs-android-native.zip
  # The Kotlin Multiplatform pair: the archives the module is built out of, and
  # the maven repository it is published as. `marsrs-kmp-native.zip` is what
  # `scripts/build_kmp_native.sh` writes for every Kotlin target plus the .so
  # files of the JNI bridge; `marsrs-kmp-maven.zip` is the repository itself,
  # for a consumer who would rather not authenticate to GitHub Packages.
  KMP_NATIVE_ZIP: marsrs-kmp-native.zip
  KMP_MAVEN_ZIP: marsrs-kmp-maven.zip
  # the whole port, and xlog alone: the pair the crates on crates.io are, and
  # the pair the C++ project publishes as `mars-core` and `mars-xlog`
  MARSRS_AAR: marsrs.aar
  MARSRS_XLOG_AAR: xlog.aar
  # What JitPack publishes the two AARs as; see jitpack.yml. JitPack serves a
  # repository under com.github.<owner>.<repo> whatever the pom's group is, so
  # the build is asked for under both spellings.
  JITPACK_GROUP: io.github.orangeboychen.marsrs
  JITPACK_ARTIFACT: marsrs
  JITPACK_ARTIFACT_XLOG: xlog
  # The Kotlin Multiplatform pair, published to GitHub Packages under the same
  # group: the whole port and xlog alone, the same two.
  KMP_GROUP: io.github.orangeboychen.marsrs
  KMP_ARTIFACT: marsrs-kmp
  KMP_ARTIFACT_XLOG: xlog-kmp
  NDK_VERSION: 27.1.12297006
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      is_new: ${{ steps.resolve.outputs.is_new }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        # The arithmetic of it is .github/scripts/release_version.sh, which is the one
        # thing here worth running on its own: `git ls-remote` and
        # `gh release view` are all it needs, and both can be stubbed.
        run: .github/scripts/release_version.sh

  apple:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-15
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version 2>/dev/null | head -2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the xcframeworks
        run: scripts/build_xcframework.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-apple
          path: |
            dist/${{ env.XCFRAMEWORK_ZIP }}
            dist/${{ env.XCFRAMEWORK_NET_ZIP }}

  # The CocoaPods pods: one zip per pod that carries a binary, each holding the
  # framework and the Swift of its module, because a pod has one `source` and it
  # is the only thing `pod install` fetches — see
  # scripts/package_cocoapods.sh. `MarsRS` is not packaged here: it carries no
  # framework of its own, so what `pod install` reads for it is the git tag.
  cocoapods:
    needs: [version, apple]
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-15
    env:
      # The names `scripts/package_cocoapods.sh` writes, and the assets the two
      # podspecs name: a pod is downloaded by the version it is.
      POD_XLOG_ZIP: marsrs-cocoapods-xlog-${{ needs.version.outputs.version }}.zip
      POD_NET_ZIP: marsrs-cocoapods-net-${{ needs.version.outputs.version }}.zip
    steps:
      - uses: actions/checkout@v7
      # CocoaPods is on the image and not installed here, and what it is is worth
      # knowing when a lint says something a newer one would not.
      - name: Show the CocoaPods version
        run: pod --version
      - name: Collect the xcframeworks
        uses: actions/download-artifact@v8
        with:
          name: release-apple
          path: dist
      - name: Package the pods
        run: scripts/package_cocoapods.sh "${{ needs.version.outputs.version }}" dist
      - name: Prove a pod builds
        # `pod lib lint` compiles the pod's Swift against the framework it
        # vendors, in an app it generates — the only check a podspec ever gets,
        # and the proof that an app's Xcode can build what the pod hands it. It
        # needs no release to run: linting a pod does not fetch its `source`, so
        # the url this run has not published yet is not something it can fail on.
        #
        # iOS only, and not the watchos the pod declares as well: the app lint
        # generates builds the watchOS simulator for arm64 *and* x86_64, and the
        # framework's watchOS simulator slice is arm64 alone — there is no
        # x86_64 watchOS simulator among the Rust targets it is built from — so
        # a watchOS lint has no slice to select and fails on that rather than on
        # the pod. An app of either platform compiles the same two things.
        run: |
          set -euo pipefail
          for PAIR in "$POD_XLOG_ZIP:MarsRSXlog" "$POD_NET_ZIP:MarsRSNet"; do
            ZIP="${PAIR%%:*}"
            POD="${PAIR##*:}"
            DIR="target/pod-lint/$POD"
            rm -rf "$DIR"
            mkdir -p "$DIR"
            unzip -q "dist/$ZIP" -d "$DIR"
            cp "$POD.podspec" "$DIR/"
            (cd "$DIR" && pod lib lint "$POD.podspec" --platforms=ios)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-cocoapods
          path: |
            dist/${{ env.POD_XLOG_ZIP }}
            dist/${{ env.POD_NET_ZIP }}

  android:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Gradle's own downloads — the dependency cache of every module, and the
      # wrapper it is invoked through — which a job without them fetches from
      # scratch. The key is the manifest of the build, so a Gradle that moved is
      # a key that missed and a cache that is filled again rather than a stale
      # one that is restored.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # The NDK, and the SDK platform and the build tools the AAR is assembled
      # with. `android-actions/setup-android` is deliberately not used, and why
      # is written down in .github/scripts/install_android_ndk.sh.
      - name: Install the Android SDK components
        run: .github/scripts/install_android_ndk.sh "platforms;android-34" "build-tools;34.0.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build the native libraries
        # `RUSTFLAGS` is not exported here on purpose: an exported one replaces
        # the 16 KiB page size that .cargo/config.toml sets per Android target.
        run: scripts/build_android.sh dist/native
      - name: Assemble the AARs
        run: |
          set -euo pipefail
          cd dist/native
          zip -q -r "$GITHUB_WORKSPACE/dist/$NATIVE_ZIP" .
          cd "$GITHUB_WORKSPACE"
          # the same .so in both modules: marsrs wraps all of it, marsrs-xlog
          # only the logging half
          for MODULE in marsrs marsrs-xlog; do
            mkdir -p "platforms/android/$MODULE/libs"
            cp -r dist/native/. "platforms/android/$MODULE/libs/"
          done
          (cd platforms/android && ./gradlew --no-daemon :marsrs:assembleRelease :marsrs-xlog:assembleRelease)
          cp platforms/android/marsrs/build/outputs/aar/marsrs-release.aar "dist/$MARSRS_AAR"
          cp platforms/android/marsrs-xlog/build/outputs/aar/marsrs-xlog-release.aar "dist/$MARSRS_XLOG_AAR"
          # An AAR with no R8 rules in it is an AAR that breaks the app that
          # shrinks its release build — the .so and the Kotlin name each
          # other, and R8 renames both halves — so say so here and not in
          # someone's crash log. `consumerProguardFiles` is what AGP turns
          # into the `proguard.txt` of the AAR.
          for AAR in "dist/$MARSRS_AAR" "dist/$MARSRS_XLOG_AAR"; do
            # Read whole and matched with `case`, and not piped into a
            # `grep -q`: one that matches stops reading at the line it
            # matched, `unzip` is left writing the rest of the listing into a
            # pipe nobody is reading, and the SIGPIPE it dies of is — under
            # the `pipefail` this step asks for — a "carries no
            # proguard.txt" over an archive that carries one. What makes it a
            # race and not a certainty is the size of the listing: a pipe
            # holds 64 KiB before it is grown, and the jniLibs of four ABIs
            # are what an AAR's listing is a listing of.
            listing="$(unzip -l "$AAR")"
            case "$listing" in
              *" proguard.txt"*) ;;
              *)
                echo "::error file=$AAR::$AAR carries no proguard.txt: its consumerProguardFiles are missing"
                exit 1
                ;;
            esac
            echo "$AAR: $(unzip -p "$AAR" proguard.txt | grep -c '^-keep') keep rules"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          # the three files this module publishes, and not `dist/`: that
          # directory also holds dist/native, the .so tree that
          # marsrs-android-native.zip is zipped from, and a directory is not
          # something the release can be given
          path: |
            dist/${{ env.NATIVE_ZIP }}
            dist/${{ env.MARSRS_AAR }}
            dist/${{ env.MARSRS_XLOG_AAR }}

  host:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the C ABI
        # `--features sdt,stn`: a host that links the C ABI gets the diagnosis
        # and the task pipeline too, which is what the Android `.so` carries.
        # xlog alone is what the Apple artifact is, and it spells its own set
        # out.
        run: cargo build --release -p marsrs-ffi --features sdt,stn
      - name: Package it
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target }}"
          stage="dist/marsrs-$version-$target"
          mkdir -p "$stage/include" "$stage/lib"
          cp crates/marsrs-ffi/include/mars_xlog.h "$stage/include/"
          cp crates/marsrs-ffi/include/mars_sdt.h "$stage/include/"
          cp crates/marsrs-ffi/include/mars_stn.h "$stage/include/"
          cp LICENSE README.md "$stage/"
          for lib in target/release/libmars_ffi.a target/release/libmars_ffi.so \
                     target/release/libmars_ffi.dylib target/release/mars_ffi.lib \
                     target/release/mars_ffi.dll target/release/mars_ffi.dll.lib; do
            [ -f "$lib" ] && cp "$lib" "$stage/lib/"
          done
          test -n "$(ls -A "$stage/lib")"
          ls -l "$stage/lib"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd dist && 7z a -r -tzip "marsrs-$version-$target.zip" "marsrs-$version-$target" > /dev/null)
            rm -rf "$stage"
          else
            tar -czf "dist/marsrs-$version-$target.tar.gz" -C dist "marsrs-$version-$target"
            rm -rf "$stage"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-host-${{ matrix.target }}
          path: dist/

  # The `xlog` CLI: one archive per host, for whoever has a `.xlog` to read and
  # no Rust toolchain — an operator pulling a log off a device, a build that
  # decrypts what it uploads. It is the `xlog` bin of `marsrs-xlog`, so
  # `cargo install marsrs-xlog` gets the same command off crates.io; the archive
  # is for the machine that has neither.
  #
  # The same three hosts as the C ABI's, for the same reason: an executable runs
  # where it was built, so it is built where it runs.
  cli:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI
        # `--bin xlog` and not `-p marsrs-xlog`: the crate's lib is the xlog
        # half an app links, and this job is the one command in it.
        run: cargo build --release -p marsrs-xlog --bin xlog
      - name: Package it
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target }}"
          stage="dist/marsrs-xlog-cli-$version-$target"
          mkdir -p "$stage"
          cp LICENSE README.md "$stage/"
          for bin in target/release/xlog target/release/xlog.exe; do
            [ -f "$bin" ] && cp "$bin" "$stage/"
          done
          # The one file the archive is for: a stage of two text files and no
          # command in it is a release that installs nothing.
          test -f "$stage/xlog" || test -f "$stage/xlog.exe"
          ls -l "$stage"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd dist && 7z a -r -tzip "marsrs-xlog-cli-$version-$target.zip" "marsrs-xlog-cli-$version-$target" > /dev/null)
            rm -rf "$stage"
          else
            tar -czf "dist/marsrs-xlog-cli-$version-$target.tar.gz" -C dist "marsrs-xlog-cli-$version-$target"
            rm -rf "$stage"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-cli-${{ matrix.target }}
          path: dist/

  # The native libraries of the Kotlin Multiplatform module, one host per job:
  # every Apple target on macOS, because an Apple archive cannot be built from
  # Linux, and Linux and Windows on Linux, where the cross toolchains are.
  kmp-apple:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-15
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Apple archives
        run: scripts/build_kmp_native.sh dist/kmp-native
      - uses: actions/upload-artifact@v7
        with:
          name: kmp-native-apple
          path: dist/kmp-native

  kmp-host:
    needs: [version, android]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v7
      - name: Install the cross toolchains
        # `aarch64-linux-gnu-gcc` for the Linux archive of an arm64 machine and
        # `mingw-w64` for the Windows one: `scripts/build_kmp_native.sh` reads
        # both out of the environment.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu mingw-w64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the Linux and Windows archives
        run: scripts/build_kmp_native.sh dist/kmp-native
      - uses: actions/upload-artifact@v7
        with:
          name: kmp-native-host
          path: dist/kmp-native
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # Kotlin/Native's compiler: the ~1 GB toolchain `kotlin-native` unpacks
      # into `~/.konan`, which every job that asks Gradle for a Kotlin target
      # fetches again. Cached apart from Gradle's own, because what changes it
      # is the Kotlin version and not the build: under one key for the two, an
      # edit to a `.gradle.kts` was a download of the toolchain over again.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      # Gradle's own: the wrapper, and the dependencies of a module with an
      # Android target and thirteen Kotlin/Native ones in it — which is what
      # the key is the hash of. No build cache is kept in it, and
      # `platforms/kmp/gradle.properties` says why.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # The Android SDK, for the `androidTarget` of the module: Gradle will not
      # even configure a project that has one without it, whether or not the
      # task it is asked for is Android's.
      - name: Install the Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::no sdkmanager on this image, and the Kotlin Multiplatform module has an Android target"
            exit 1
          fi
          # `yes` is killed by SIGPIPE as soon as sdkmanager stops reading, and
          # under `pipefail` that 141 would fail the job although sdkmanager
          # itself succeeded.
          { yes || true; } | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > platforms/kmp/local.properties
      - name: Collect the JNI libraries
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: dist
      - name: Unpack the JNI libraries
        run: |
          set -euo pipefail
          # `platforms/kmp/native/` is not of the repository — .gitignore
          # keeps out what these jobs assemble into it — so there is nothing
          # to unpack into yet, and `unzip -d` makes the directory it is given
          # and not the one above it. Hence the `mkdir`, and hence a step that
          # failed on a runner and never on a machine that had built the
          # module before.
          mkdir -p platforms/kmp/native/android
          unzip -q -o "dist/$NATIVE_ZIP" -d platforms/kmp/native/android
      - name: Collect the archives of this host
        run: cp -R dist/kmp-native/. platforms/kmp/native/
      - name: Prove an archive links
        # The same proof the `kmp` job makes on macOS, for the target this host
        # can execute: `linuxX64`. It is the only check the Linux linker flags of
        # `mars_ffi.def` ever get, and the Windows ones get none — there is no
        # runner that can execute a mingw binary here.
        #
        # `enableKlibsCrossCompilation=false`, for the ten Apple targets this
        # host has no toolchain for: cinterop needs the one of the target, so
        # without the flag Gradle asks for each of them and answers itself
        # seventeen times, over a log whose only question is whether `linuxX64`
        # links. Asked here and not written into `gradle.properties`, because
        # the `kmp` job on macOS publishes the klibs of the Linux and Windows
        # targets — that *is* the cross-compilation this forbids.
        # `enableCInteropCommonization=false`, and with it no wait on
        # `kmp-apple`: a commonized klib is one Gradle can only build out of
        # the cinterop of every target of the module, which is what made this
        # job download the ten Apple archives to prove that the Linux one
        # links. What needs commonization is the metadata compilation of
        # `nativeMain`, and that is not in the graph of a test of one target —
        # the compile of a target reads the cinterop of that target. The ten
        # Apple archives are the `kmp` job's, and that one still waits for
        # them.
        #
        # `ignoreDisabledTargets` is deliberately not asked for: which targets
        # were disabled is the one line that would say so if `linuxX64` itself
        # were, and a test that silently skips is a green job that proved
        # nothing.
        run: (cd platforms/kmp && ./gradlew --no-daemon -Pkotlin.native.enableKlibsCrossCompilation=false -Pkotlin.mpp.enableCInteropCommonization=false :marsrs-xlog:linuxX64Test)

  # The Kotlin Multiplatform release: `marsrs-kmp` and `xlog-kmp` as a
  # maven repository, on GitHub Packages and, as a zip, on the release.
  #
  # One job on macOS and not one per target, because a Kotlin Multiplatform
  # publication is one artifact per target of one module: the module metadata of
  # `xlog-kmp` names all fourteen of them, so a publication that left
  # one out is a publication Gradle cannot resolve for the platform it forgot.
  # macOS is where all fourteen can be built, and it is the only place an Apple
  # one can.
  kmp:
    needs: [version, android, kmp-apple, kmp-host]
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      # The two caches `kmp-host` has, for the same reason and in the same
      # shape — its comment says what they are. This job and that one are the
      # two that ask Gradle for a Kotlin target, and they pay for the toolchain
      # separately on separate runners.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties', '**/gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install the Android SDK components
        # The module has an Android target, so every `./gradlew` of it needs the
        # SDK — the test step as much as the publishing one. The macOS image
        # ships it under the home directory, which is where Gradle looks for it
        # once `local.properties` says so.
        run: |
          set -euo pipefail
          android_home="$HOME/Library/Android/sdk"
          echo "ANDROID_HOME=$android_home" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_home" >> "$GITHUB_ENV"
          sdkmanager=$(ls -d "$android_home"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)
          if [ -z "$sdkmanager" ]; then
            echo "::error::no cmdline-tools under $android_home, and the Kotlin Multiplatform module needs the Android SDK"
            exit 1
          fi
          # `yes` is killed by SIGPIPE as soon as sdkmanager stops reading, and
          # under `pipefail` that 141 would fail the job although sdkmanager
          # itself succeeded.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;34.0.0"
          echo "sdk.dir=$android_home" > platforms/kmp/local.properties
      - name: Collect the native archives
        uses: actions/download-artifact@v8
        with:
          pattern: kmp-native-*
          merge-multiple: true
          path: platforms/kmp/native
      - name: Collect the JNI libraries
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: dist
      - name: Unpack the JNI libraries
        run: |
          set -euo pipefail
          mkdir -p platforms/kmp/native/android
          unzip -q -o "dist/$NATIVE_ZIP" -d platforms/kmp/native/android
          find platforms/kmp/native -name '*.a' -o -name '*.so' | sort
      - name: Prove an archive links
        # Nothing on the way to Maven links a klib, so without this a wrong
        # linker flag in mars_ffi.def is a link error in an app a month later
        # instead of a failed release. It builds and runs the test of the host's
        # own target: macosArm64 here, the one Kotlin/Native target this runner
        # can execute.
        #
        # No `--no-daemon`, the way the two steps after it are not either: this
        # job asks Gradle three times, and a daemon is what keeps the compiled
        # build scripts and the resolved dependencies of the first call for the
        # two that follow.
        run: (cd platforms/kmp && ./gradlew :marsrs-xlog:macosArm64Test)
      - name: Publish to GitHub Packages
        # `continue-on-error`, for the reason the npm step gives: GitHub
        # Packages refusing a version is about GitHub Packages, and a release
        # is not a thing to keep back over it. publish.yml publishes the pair
        # out of `marsrs-kmp-native.zip`, the native archives this job packs.
        if: needs.version.outputs.is_new == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd platforms/kmp && ./gradlew -PpublishedVersion="${{ needs.version.outputs.version }}" \
            -PmavenUser="$GITHUB_ACTOR" -PmavenPassword="$GITHUB_TOKEN" \
            :marsrs:publishAllPublicationsToGitHubPackagesRepository \
            :marsrs-xlog:publishAllPublicationsToGitHubPackagesRepository)
      - name: Publish to the local repository
        # GitHub Packages is immutable — a version it has cannot be overwritten
        # — so a tag that exists already is only ever republished as the zip.
        run: |
          (cd platforms/kmp && ./gradlew -PpublishedVersion="${{ needs.version.outputs.version }}" \
            :marsrs:publishToMavenLocal :marsrs-xlog:publishToMavenLocal)
      - name: Package the maven repository
        # Zipped from the root of the repository and not from the group's
        # directory: a consumer points `maven { url = uri("<dir>") }` at
        # whatever this unpacks to, and Gradle looks for
        # `io/github/orangeboychen/marsrs/<artifact>` under it — an archive that
        # at the artifact is a repository of no coordinates at all.
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP="$GITHUB_WORKSPACE/dist/$KMP_MAVEN_ZIP"
          (cd "$HOME/.m2/repository" && zip -q -r "$ZIP" io/github/orangeboychen)
          # the layout is the whole point of the step, so it is checked here and
          # not by whoever unpacks the zip a month from now
          for ARTIFACT in "$KMP_ARTIFACT" "$KMP_ARTIFACT_XLOG"; do
            # Read whole and matched with `case`, and not piped into a
            # `grep -q`: one that matches stops reading at the line it
            # matched, `unzip` is left writing the rest of the listing into a
            # pipe nobody is reading, and the SIGPIPE it dies of is — under
            # the `pipefail` this step asks for — a "holds no <artifact>" over
            # an archive that holds one. The listing is two hundred lines of a
            # repository of fourteen targets, which is what makes it a race
            # and not a certainty: a pipe holds 16 KiB on a macOS runner
            # before it is grown, and that is about what the listing is.
            listing="$(unzip -l "$ZIP")"
            case "$listing" in
              *"io/github/orangeboychen/marsrs/$ARTIFACT/"*) ;;
              *)
                echo "::error::$ZIP holds no io/github/orangeboychen/marsrs/$ARTIFACT"
                exit 1
                ;;
            esac
          done
      - name: Package the native archives
        run: (cd platforms/kmp/native && zip -q -r "$GITHUB_WORKSPACE/dist/$KMP_NATIVE_ZIP" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-kmp
          path: |
            dist/${{ env.KMP_MAVEN_ZIP }}
            dist/${{ env.KMP_NATIVE_ZIP }}

  # The four packages of the two plugin ecosystems: the two Flutter plugins and
  # the two React Native modules, stamped with the version of this release and
  # carrying the one thing a consumer cannot resolve for itself — the apple
  # job's xcframework, which CocoaPods cannot take out of Package.swift.
  #
  # Nothing is compiled here: the framework is the apple job's, and the AAR the
  # Android half of each package resolves is JitPack's. So this is the one job
  # of the release with no toolchain to install, and it does not wait for the
  # Android or the Kotlin half of it.
  #
  # Packaging needs no credential and is never skipped: it is what the docs tell
  # a consumer to install while publishing is not switched on. The registries
  # need none either — both take this run's OIDC token.
  plugins:
    needs: [version, apple]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      # A job-level `permissions` is a whole block and not an addition: every
      # permission it does not name is `none`, and `actions/checkout` needs
      # `contents: read` for the repository it checks out.
      contents: read
      # npm's trusted publishing: `npm publish` asks the registry for a token
      # and answers with this run's own identity, so there is no token here to
      # keep, rotate or leak.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # Node 24, which is npm 11: trusted publishing is npm 11.5.1 and later.
      # No `registry-url`, on purpose — setup-node answers it by writing an
      # `_authToken` of the (empty) token into .npmrc, and an empty token is
      # exactly what stops npm from asking for one of its own.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Collect the Apple frameworks
        uses: actions/download-artifact@v8
        with:
          name: release-apple
          path: dist
      - name: Package the Flutter plugins
        run: scripts/package_flutter.sh "${{ needs.version.outputs.version }}" dist
      - name: Package the React Native modules
        run: scripts/package_react_native.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-plugins
          path: |
            dist/marsrs-flutter-*.tar.gz
            dist/marsrs-react-native-*.tgz
      # The registry, last in this job and only for a tag that is new: what is
      # published to it is immutable, so a version it has cannot be published
      # over. pub.dev is not asked here, and pub.yml says why.
      #
      # `continue-on-error`: what npm needs — this repository named as a
      # trusted publisher of the package — is set on npmjs.com and not here, so
      # a publish it refuses is a thing only a person can put right, and a
      # release held back over it would hold back the tag, the assets and every
      # other registry of the same release with it. What the release loses is
      # npm alone, and publish.yml gives it back out of the two tarballs this
      # job uploads.
      - name: Publish the React Native modules to npm
        if: needs.version.outputs.is_new == 'true'
        continue-on-error: true
        run: .github/scripts/publish_npm.sh "${{ needs.version.outputs.version }}"

  # HarmonyOS: two assets, because there are two ways in. The three
  # `libmars_ffi.so` of marsrs-harmony-<version>.tar.gz, one per ABI, are for an
  # app that writes its own NAPI module against the C ABI; the
  # marsrs-harmonyos-xlog-<version>.har of the second half of this job is the
  # package, ArkTS and all, for an app that does not. `libmarsrs_xlog.so` of the
  # HAR is the same Rust core with the NAPI seam of
  # platforms/harmonyos/marsrs-xlog linked around it, so the two are one crate
  # built twice and not two ports.
  #
  # No credential gates the build: the OpenHarmony SDK is public and the script
  # downloads it. What does gate it is the 2.7 GB that download is, which a
  # cache answers once and not once per release. ohpm is the one registry here
  # that needs a secret, and it is gated in the script and not in the job: with
  # no publish code configured, .github/scripts/publish_ohpm.sh says so and the
  # HAR goes out as a release asset alone.
  harmony:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      # No `RUSTFLAGS: '-D warnings'` here, the way the apple jobs have it: a
      # target of a tier 2 platform is a target whose warnings this port has
      # never had to answer for, and rust.yml's harmony job builds it without.
      OHOS_SDK_VERSION: 6.1-Release
      # Outside `target/`, so that the rust cache below does not carry the SDK
      # a second time — the same reason rust.yml's harmony job keeps it here.
      OHOS_SDK_CACHE: ${{ github.workspace }}/.ohos-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-unknown-linux-ohos
            armv7-unknown-linux-ohos
            x86_64-unknown-linux-ohos
      - name: Cache the OHOS SDK
        uses: actions/cache@v6
        with:
          path: .ohos-sdk
          key: ohos-sdk-${{ env.OHOS_SDK_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and package the HarmonyOS libraries
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          stage="dist/marsrs-harmony-$version"
          scripts/build_harmony.sh "$stage"
          # the three headers of the C ABI the app calls, and the licence it is
          # under: `build_harmony.sh` builds `marsrs-ffi` with `sdt,stn` on top
          # of the default `xlog`, so the `.so` it wrote answers `mars_stn_*`
          # and `mars_sdt_*` as well, and shipping `mars_xlog.h` alone would
          # hide two thirds of what the library exports.
          mkdir -p "$stage/include"
          cp crates/marsrs-ffi/include/mars_xlog.h "$stage/include/"
          cp crates/marsrs-ffi/include/mars_sdt.h "$stage/include/"
          cp crates/marsrs-ffi/include/mars_stn.h "$stage/include/"
          cp LICENSE README.md "$stage/"
          tar -czf "$stage.tar.gz" -C dist "marsrs-harmony-$version"
          ls -l "$stage.tar.gz"
      # The package: the NAPI module of platforms/harmonyos/marsrs-xlog, one per
      # ABI, and the HAR the ArkTS above it and those three `.so` are packed
      # into. The SDK is already downloaded and the Rust core is already built
      # by the step above, so this is the NAPI shim and the link of each ABI —
      # and no CMake, which is why a Linux runner can do it.
      - name: Build the NAPI module and package the ohpm HAR
        run: |
          set -euo pipefail
          scripts/build_harmony_napi.sh target/harmony-napi
          scripts/package_harmony.sh "${{ needs.version.outputs.version }}" dist \
            target/harmony-napi
      - uses: actions/upload-artifact@v7
        with:
          name: release-harmony
          path: |
            dist/marsrs-harmony-*.tar.gz
            dist/marsrs-harmonyos-xlog-*.har
      # ohpm, last, and only for a tag that is new. Unlike npm it takes no OIDC
      # token, so this is the one publish here that a secret gates — and it is
      # the script that decides what an unset secret means, which is a warning
      # and an unpublished HAR rather than a failed release.
      - name: Publish the HarmonyOS package to ohpm
        if: needs.version.outputs.is_new == 'true'
        env:
          # The publish code ohpm gives the publisher of the package — its
          # `publish_id` — which is what the repository's OHOS_PUBLIC_TOKEN
          # holds; and the private half of the keypair whose public half is
          # uploaded to ohpm.
          OHOS_PUBLIC_TOKEN: ${{ secrets.OHOS_PUBLIC_TOKEN }}
          OHPM_KEY: ${{ secrets.OHPM_KEY }}
        run: .github/scripts/publish_ohpm.sh "${{ needs.version.outputs.version }}"

  publish:
    needs: [version, apple, cocoapods, android, host, cli, kmp, plugins, harmony]
    if: needs.version.outputs.skip != 'true'
    # macOS so that the checksum is the one SwiftPM itself computes, the same
    # way orangeboyChen/mars does it
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Compute the SPM checksums
        id: checksum
        run: |
          set -euo pipefail
          # one per binary target of Package.swift: an artifact is bound to the
          # checksum of the zip it was published as
          echo "xlog=$(swift package compute-checksum "dist/$XCFRAMEWORK_ZIP")" >> "$GITHUB_OUTPUT"
          echo "net=$(swift package compute-checksum "dist/$XCFRAMEWORK_NET_ZIP")" >> "$GITHUB_OUTPUT"

      - name: Point Package.swift and the podspecs at this release
        if: needs.version.outputs.is_new == 'true'
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CHECKSUM: ${{ steps.checksum.outputs.xlog }}
          CHECKSUM_NET: ${{ steps.checksum.outputs.net }}
        run: |
          set -euo pipefail
          BRANCH="chore/package-swift-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          # One url and one checksum per artifact; the rewrite is
          # .github/scripts/update_package_swift.py.
          python3 .github/scripts/update_package_swift.py "$TAG" "$CHECKSUM" "$XCFRAMEWORK_ZIP" \
                     "$CHECKSUM_NET" "$XCFRAMEWORK_NET_ZIP"
          # The three pods, at the version of this release: what a podspec names
          # is the asset `pod install` downloads, which is this run's.
          python3 .github/scripts/update_podspecs.py "$TAG"

          git commit -am "chore: point Package.swift and the podspecs at $TAG"
          # force: rerunning the same version reuses the branch and its PR
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "chore: point Package.swift and the podspecs at $TAG" \
              --body "Automated release change: \`Package.swift\` and the three podspecs now point at \`$TAG\`.

          | | |
          |---|---|
          | tag | \`$TAG\` |
          | $XCFRAMEWORK_ZIP | \`$CHECKSUM\` |
          | $XCFRAMEWORK_NET_ZIP | \`$CHECKSUM_NET\` |
          | MarsRSXlog, MarsRSNet | \`marsrs-cocoapods-{xlog,net}-${TAG#v}.zip\` |

          The release and the \`$TAG\` tag are published from this branch, so SPM
          resolves the new \`Package.swift\` from the tag and \`pod install\`
          downloads the asset of the version a podspec names. Merging only keeps
          \`${{ github.ref_name }}\` in sync.")
          fi

          # best effort: auto-merge keeps the default branch in sync where the
          # ruleset allows it; where it does not, the PR waits for a human and
          # the published release is unaffected either way
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::could not enable auto-merge for $PR_URL; merge it by hand to sync ${{ github.ref_name }}"

          echo "pr=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ steps.package.outputs.sha || github.sha }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          # assets, and only assets: the uploads API answers "is a directory"
          # for anything that is not a file, and a glob cannot tell the two
          # apart, so whatever is in dist is filtered here
          ASSETS=()
          for ARTIFACT in *; do
            if [ -f "$ARTIFACT" ]; then
              ASSETS+=("$ARTIFACT")
            else
              echo "::warning::$ARTIFACT in dist is not a file, it is not published"
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            # publish every asset once, never overwrite: the SPM checksum in
            # Package.swift is bound to the zip that was published for the tag
            PUBLISHED=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for ARTIFACT in "${ASSETS[@]}"; do
              if grep -qx "$ARTIFACT" <<< "$PUBLISHED"; then
                echo "skip $ARTIFACT, it is already published for $TAG"
              else
                gh release upload "$TAG" "$ARTIFACT"
              fi
            done
          else
            FLAGS=()
            [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes \
              "${FLAGS[@]}" "${ASSETS[@]}"
          fi

      - name: Create the git tag
        if: needs.version.outputs.is_new == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ steps.package.outputs.sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$SHA"
          git push -f origin "$TAG"

      - name: Ask pub.yml to publish the plugins
        # A tag this workflow pushed is a tag GitHub will not let start another
        # run: what the default token does is not an event that triggers one. So
        # pub.yml's tag-push trigger would never fire, and it is dispatched
        # instead — with the tag as its ref, which is what pub.dev asks of a run
        # that publishes ("Pub.dev rejects publishing from GitHub Actions
        # triggered without a tag").
        if: needs.version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh workflow run pub.yml --ref "$TAG"

      - name: Trigger the JitPack build
        # JitPack builds lazily, so nothing would publish the AAR until a
        # consumer asks for it. .github/scripts/jitpack_build.sh kicks the build off
        # once the release assets are online and waits for the answer.
        #
        # `continue-on-error`: the release and the tag are out by now, so a
        # build jitpack.io answers no to is a fact about jitpack.io — and this
        # is the last step before `crates`, which would otherwise be skipped
        # over it. Asking again is what publish.yml does.
        continue-on-error: true
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: .github/scripts/jitpack_build.sh

      - name: Summary
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "### $TAG"
            echo ""
            echo '```swift'
            echo ".package(url: \"https://github.com/orangeboyChen/mars-rs\", from: \"${TAG#v}\")"
            echo '```'
            echo ""
            # one per binary target: the checksum a consumer's `swift package
            # resolve` checks is the one of the zip it downloads
            echo "SPM checksum, $XCFRAMEWORK_ZIP: \`${{ steps.checksum.outputs.xlog }}\`"
            echo "SPM checksum, $XCFRAMEWORK_NET_ZIP: \`${{ steps.checksum.outputs.net }}\`"
            echo ""
            echo "Package.swift PR: ${{ steps.package.outputs.pr || 'not needed, the tag exists already' }}"
            echo ""
            # CocoaPods: the pods are not on a spec repo, so what an app names is
            # the podspec of the tag and not the pod alone
            echo '```ruby'
            echo "pod 'MarsRSXlog', :podspec => 'https://raw.githubusercontent.com/orangeboyChen/mars-rs/$TAG/MarsRSXlog.podspec'"
            echo "pod 'MarsRSNet', :podspec => 'https://raw.githubusercontent.com/orangeboyChen/mars-rs/$TAG/MarsRSNet.podspec'"
            echo '```'
            echo ""
            echo '```kotlin'
            # the version a consumer writes, without the "v" of the tag: the
            # coordinate is a maven version, and the tag is not
            echo "implementation(\"$JITPACK_GROUP:$JITPACK_ARTIFACT:${TAG#v}\")"
            echo "implementation(\"$JITPACK_GROUP:$JITPACK_ARTIFACT_XLOG:${TAG#v}\")"
            echo '```'
            echo ""
            echo "Kotlin Multiplatform — every target from `commonMain`, on GitHub Packages:"
            echo ""
            echo '```kotlin'
            echo "implementation(\"$KMP_GROUP:$KMP_ARTIFACT:${TAG#v}\")"
            echo "implementation(\"$KMP_GROUP:$KMP_ARTIFACT_XLOG:${TAG#v}\")"
            echo '```'
            echo ""
            # the four plugin packages: on the release as an archive always, and
            # on the registry once it knows this repository as a trusted
            # publisher of them
            echo "React Native — npm:"
            echo ""
            echo '```bash'
            echo "npm install marsrs-react-native@${TAG#v}"
            echo "npm install marsrs-react-native-xlog@${TAG#v}"
            echo '```'
            echo ""
            echo "Flutter — pub.dev:"
            echo ""
            echo '```bash'
            echo "flutter pub add marsrs@${TAG#v}"
            echo "flutter pub add marsrs_xlog@${TAG#v}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The registry half of the same release. Two of the twelve crates are the
  # ones a Rust caller takes — `marsrs`, the whole port, and `marsrs-xlog`,
  # xlog alone, the pair the C++ project publishes as `mars-core` and
  # `mars-xlog` — and seven go with them because crates.io resolves a
  # dependency out of the registry and not out of a path: a published crate
  # cannot depend on a crate that is not published.
  #
  # `marsrs-ffi`, `marsrs-jni` and `marsrs-compat` are the three that stay off
  # it, each with `publish = false` and a note saying why: what their callers
  # need is a `libmars_ffi.a`, a `libmarsrsxlog.so` and a CLI for the
  # differential test, and none of those is in what `cargo publish` packs. The
  # CLI a *user* runs is not one of them: it is the `xlog` bin of
  # `marsrs-xlog`, and it goes out with the crate and as an archive of its own.
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    # After the release and not beside it: a version on crates.io is published
    # once and never overwritten, so a crate goes out only for a release that
    # exists.
    needs: [version, publish]
    if: needs.version.outputs.is_new == 'true'
    env:
      # crates.io answers 403 to the user agent `curl` sends by default.
      CRATES_IO_UA: mars-rs release (https://github.com/orangeboyChen/mars-rs)
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The manifests, and then the nine crates:
      # .github/scripts/publish_crates.sh, which publish.yml runs too, off a
      # checkout of the tag.
      - name: Publish the nine crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/scripts/publish_crates.sh "${{ needs.version.outputs.version }}"

      - name: Summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "### crates.io $VERSION"
            echo ""
            echo '```toml'
            echo "marsrs = \"$VERSION\"       # the whole port"
            echo "marsrs-xlog = \"$VERSION\"  # xlog alone"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
