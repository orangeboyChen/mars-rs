name: Release

# One release for every platform:
#
#   * MarsRSXlog.xcframework.zip   -> the xlog binary target of Package.swift
#   * MarsRSNet.xcframework.zip    -> the net one (the diagnosis and the tasks)
#   * mars-core.aar              -> JitPack: io.github.orangeboyChen:mars-rs
#   * mars-xlog.aar              -> JitPack: io.github.orangeboyChen:mars-rs-xlog
#   * mars-android-native.zip    -> the .so files, for a consumer's own AAR
#   * mars-rs-<version>-<host>.tar.gz / .zip -> the C ABI for Linux/macOS/Windows
#
# Trigger it by hand (Actions -> Release -> Run workflow):
#
#   * version: the version, typed out — "1.2.3", "v1.2.3-alpha.1", "0.2.0-beta.2"
#   * bump + prerelease: "the next patch, as the second alpha", which is what
#     the sequence v1.2.4-alpha.1 -> v1.2.4-alpha.2 -> v1.2.4 is made of
#
# The number counts on only while it is that version being worked towards: as
# long as no stable v1.2.4 is out, the next alpha is v1.2.4-alpha.3, and the
# bump is what it would be applied to. A v1.2.4 that *is* out already sends the
# bump to v1.2.5, whose first alpha is v1.2.5-alpha.1 — the number belongs to
# the version, not to the repository.
#
# The tag is the version with a "v" in front: v1.2.3, v1.2.3-alpha.1,
# v1.2.3-beta.2. Anything with a suffix is published as a GitHub pre-release.
# The number is separated from the channel by a dot, the way semver separates
# two identifiers: `beta.10` counts past `beta.9`, whereas the identifier
# `beta10` is compared letter by letter and so sorts *before* `beta2`.
#
# workflow_dispatch only: the tag is created by this workflow itself, so
# pushing one never re-triggers a run.
#
# Package.swift is updated on a topic branch and proposed as a pull request —
# the default branch refuses direct pushes (GH013), the same as in
# orangeboyChen/mars. The tag and the release are published from that branch's
# commit, so the new Package.swift resolves at the tag whether or not the PR
# has been merged yet.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3, v1.2.3-alpha.1, 0.2.0-beta.2 (overrides the bump)'
        required: false
      bump:
        description: 'Semver bump of the latest tag, when no version is typed'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      channel:
        description: 'stable, or a pre-release of the version the bump works out'
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - beta
      prerelease:
        description: 'Number only: 2 for alpha.2, 3 for beta.3 … (empty = the next one)'
        required: false

# Two releases at once race over the same tag and over the same
# `chore/package-swift-<tag>` branch, so the second waits for the first instead
# of running beside it — and it is not cancelled, because by the time it starts
# the tag it was going to create may already be out.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  XCFRAMEWORK_ZIP: MarsRSXlog.xcframework.zip
  # the same slices over the other feature set: `mars_sdt_*` and `mars_stn_*`
  # and no `mars_xlog_*`, so an app that takes both links xlog's once
  XCFRAMEWORK_NET_ZIP: MarsRSNet.xcframework.zip
  NATIVE_ZIP: mars-android-native.zip
  # the whole port, and xlog alone: the pair the C++ project publishes as
  # `mars-core` and `mars-xlog`
  CORE_AAR: mars-core.aar
  XLOG_AAR: mars-xlog.aar
  # What JitPack publishes the two AARs as; see jitpack.yml. JitPack serves a
  # repository under com.github.<owner>.<repo> whatever the pom's group is, so
  # the build is asked for under both spellings.
  JITPACK_GROUP: io.github.orangeboychen
  JITPACK_ARTIFACT: mars-rs
  JITPACK_ARTIFACT_XLOG: mars-rs-xlog
  NDK_VERSION: 27.1.12297006
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      is_new: ${{ steps.resolve.outputs.is_new }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        # The arithmetic of it is scripts/release_version.sh, which is the one
        # thing here worth running on its own: `git ls-remote` and
        # `gh release view` are all it needs, and both can be stubbed.
        run: scripts/release_version.sh

  apple:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-15
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version 2>/dev/null | head -2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the xcframeworks
        run: scripts/build_xcframework.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: |
            dist/${{ env.XCFRAMEWORK_ZIP }}
            dist/${{ env.XCFRAMEWORK_NET_ZIP }}

  android:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The NDK, and the SDK platform and the build tools the AAR is assembled
      # with. `android-actions/setup-android` is deliberately not used, and why
      # is written down in scripts/install_android_ndk.sh.
      - name: Install the Android SDK components
        run: scripts/install_android_ndk.sh "platforms;android-34" "build-tools;34.0.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build the native libraries
        # `RUSTFLAGS` is not exported here on purpose: an exported one replaces
        # the 16 KiB page size that .cargo/config.toml sets per Android target.
        run: scripts/build_android.sh dist/native
      - name: Assemble the AARs
        run: |
          set -euo pipefail
          cd dist/native
          zip -q -r "$GITHUB_WORKSPACE/dist/$NATIVE_ZIP" .
          cd "$GITHUB_WORKSPACE"
          # the same .so in both modules: mars-core wraps all of it, mars-xlog
          # only the logging half
          for MODULE in mars-core mars-xlog; do
            mkdir -p "android/$MODULE/libs"
            cp -r dist/native/. "android/$MODULE/libs/"
          done
          (cd android && ./gradlew --no-daemon :mars-core:assembleRelease :mars-xlog:assembleRelease)
          cp android/mars-core/build/outputs/aar/mars-core-release.aar "dist/$CORE_AAR"
          cp android/mars-xlog/build/outputs/aar/mars-xlog-release.aar "dist/$XLOG_AAR"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          # the three files this module publishes, and not `dist/`: that
          # directory also holds dist/native, the .so tree that
          # mars-android-native.zip is zipped from, and a directory is not
          # something the release can be given
          path: |
            dist/${{ env.NATIVE_ZIP }}
            dist/${{ env.CORE_AAR }}
            dist/${{ env.XLOG_AAR }}

  host:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: '-D warnings'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the C ABI
        # `--features sdt,stn`: a host that links the C ABI gets the diagnosis
        # and the task pipeline too, which is what the Android `.so` carries.
        # xlog alone is what the Apple artifact is, and it spells its own set
        # out.
        run: cargo build --release -p mars-ffi --features sdt,stn
      - name: Package it
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          target="${{ matrix.target }}"
          stage="dist/mars-rs-$version-$target"
          mkdir -p "$stage/include" "$stage/lib"
          cp crates/mars-ffi/include/mars_xlog.h "$stage/include/"
          cp crates/mars-ffi/include/mars_sdt.h "$stage/include/"
          cp crates/mars-ffi/include/mars_stn.h "$stage/include/"
          cp LICENSE README.md "$stage/"
          for lib in target/release/libmars_ffi.a target/release/libmars_ffi.so \
                     target/release/libmars_ffi.dylib target/release/mars_ffi.lib \
                     target/release/mars_ffi.dll target/release/mars_ffi.dll.lib; do
            [ -f "$lib" ] && cp "$lib" "$stage/lib/"
          done
          test -n "$(ls -A "$stage/lib")"
          ls -l "$stage/lib"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd dist && 7z a -r -tzip "mars-rs-$version-$target.zip" "mars-rs-$version-$target" > /dev/null)
            rm -rf "$stage"
          else
            tar -czf "dist/mars-rs-$version-$target.tar.gz" -C dist "mars-rs-$version-$target"
            rm -rf "$stage"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-host-${{ matrix.target }}
          path: dist/

  publish:
    needs: [version, apple, android, host]
    if: needs.version.outputs.skip != 'true'
    # macOS so that the checksum is the one SwiftPM itself computes, the same
    # way orangeboyChen/mars does it
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Compute the SPM checksums
        id: checksum
        run: |
          set -euo pipefail
          # one per binary target of Package.swift: an artifact is bound to the
          # checksum of the zip it was published as
          echo "xlog=$(swift package compute-checksum "dist/$XCFRAMEWORK_ZIP")" >> "$GITHUB_OUTPUT"
          echo "net=$(swift package compute-checksum "dist/$XCFRAMEWORK_NET_ZIP")" >> "$GITHUB_OUTPUT"

      - name: Point Package.swift at this release
        if: needs.version.outputs.is_new == 'true'
        id: package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          CHECKSUM: ${{ steps.checksum.outputs.xlog }}
          CHECKSUM_NET: ${{ steps.checksum.outputs.net }}
        run: |
          set -euo pipefail
          BRANCH="chore/package-swift-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          # One url and one checksum per artifact; the rewrite is
          # scripts/update_package_swift.py.
          python3 scripts/update_package_swift.py "$TAG" "$CHECKSUM" "$XCFRAMEWORK_ZIP" \
                     "$CHECKSUM_NET" "$XCFRAMEWORK_NET_ZIP"

          git commit -am "chore: point Package.swift at $TAG"
          # force: rerunning the same version reuses the branch and its PR
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "chore: point Package.swift at $TAG" \
              --body "Automated release change: \`Package.swift\` now points at \`$TAG\`.

          | | |
          |---|---|
          | tag | \`$TAG\` |
          | $XCFRAMEWORK_ZIP | \`$CHECKSUM\` |
          | $XCFRAMEWORK_NET_ZIP | \`$CHECKSUM_NET\` |

          The release and the \`$TAG\` tag are published from this branch, so SPM
          resolves the new \`Package.swift\` from the tag. Merging only keeps
          \`${{ github.ref_name }}\` in sync.")
          fi

          # best effort: auto-merge keeps the default branch in sync where the
          # ruleset allows it; where it does not, the PR waits for a human and
          # the published release is unaffected either way
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::could not enable auto-merge for $PR_URL; merge it by hand to sync ${{ github.ref_name }}"

          echo "pr=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ steps.package.outputs.sha || github.sha }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          # assets, and only assets: the uploads API answers "is a directory"
          # for anything that is not a file, and a glob cannot tell the two
          # apart, so whatever is in dist is filtered here
          ASSETS=()
          for ARTIFACT in *; do
            if [ -f "$ARTIFACT" ]; then
              ASSETS+=("$ARTIFACT")
            else
              echo "::warning::$ARTIFACT in dist is not a file, it is not published"
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            # publish every asset once, never overwrite: the SPM checksum in
            # Package.swift is bound to the zip that was published for the tag
            PUBLISHED=$(gh release view "$TAG" --json assets -q '.assets[].name')
            for ARTIFACT in "${ASSETS[@]}"; do
              if grep -qx "$ARTIFACT" <<< "$PUBLISHED"; then
                echo "skip $ARTIFACT, it is already published for $TAG"
              else
                gh release upload "$TAG" "$ARTIFACT"
              fi
            done
          else
            FLAGS=()
            [ "$PRERELEASE" = true ] && FLAGS+=(--prerelease)
            gh release create "$TAG" --target "$SHA" --title "$TAG" --generate-notes \
              "${FLAGS[@]}" "${ASSETS[@]}"
          fi

      - name: Create the git tag
        if: needs.version.outputs.is_new == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ steps.package.outputs.sha || github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$SHA"
          git push -f origin "$TAG"

      - name: Trigger the JitPack build
        # JitPack builds lazily, so nothing would publish the AAR until a
        # consumer asks for it. scripts/jitpack_build.sh kicks the build off
        # once the release assets are online and waits for the answer.
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: scripts/jitpack_build.sh

      - name: Summary
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          {
            echo "### $TAG"
            echo ""
            echo '```swift'
            echo ".package(url: \"https://github.com/orangeboyChen/mars-rs\", from: \"${TAG#v}\")"
            echo '```'
            echo ""
            # one per binary target: the checksum a consumer's `swift package
            # resolve` checks is the one of the zip it downloads
            echo "SPM checksum, $XCFRAMEWORK_ZIP: \`${{ steps.checksum.outputs.xlog }}\`"
            echo "SPM checksum, $XCFRAMEWORK_NET_ZIP: \`${{ steps.checksum.outputs.net }}\`"
            echo ""
            echo "Package.swift PR: ${{ steps.package.outputs.pr || 'not needed, the tag exists already' }}"
            echo ""
            echo '```kotlin'
            # the version a consumer writes, without the "v" of the tag: the
            # coordinate is a maven version, and the tag is not
            echo "implementation(\"$JITPACK_GROUP:$JITPACK_ARTIFACT:${TAG#v}\")"
            echo "implementation(\"$JITPACK_GROUP:$JITPACK_ARTIFACT_XLOG:${TAG#v}\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
