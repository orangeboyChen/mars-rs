name: Demos

# The gate of `demo/`: the two demos whose whole toolchain is a command line are
# built *and run*, so that a change to the port which takes a symbol out from
# under them is seen here and not by a reader who tries to run one.
#
# Why a workflow of its own and not two more jobs of rust.yml: neither demo is a
# member of the workspace — `demo/rust/Cargo.toml` takes itself out of it on
# purpose, and `demo/c` is a `cc` command line over the FFI archive — so
# `cargo build --workspace` and `cargo clippy --workspace` compile neither, and
# the `changes` filter of rust.yml is written around the crates it publishes and
# not around the programs that consume them.
#
# The filter below is the demo *and* the crates it is built over, and not the
# demo alone. A demo breaks when the library it compiles against moves, which is
# how both of these came to name symbols the xlog object had taken out of the
# surface: the commit that did it touched no file under `demo/`, so a filter of
# `demo/**` alone would have run nothing while both of them stopped compiling.
# The cost of that is a demo build and run on a pull request that touched only
# the crates, which is the pull request this gate exists for.
#
# The other six are not built here, and `demo/README.md` says why: `android`
# resolves the AAR out of JitPack, which builds it from a tag, and `kmp`
# resolves out of GitHub Packages, which answers nothing without a token a fork
# does not have; `apple` needs an Xcode project around it, `flutter` and
# `react-native` need the platform folders their own CLIs generate, and
# `harmonyos` needs the HAR out of a release. None of the six is a project a
# runner can build from this checkout.
#
# Both jobs run the demo rather than only building it: `demo/README.md` calls
# these four "verified by being run", and a demo that compiles and then writes
# no file is a demo the reader will find broken anyway.

on:
  # Every run starts, whatever the commit touched: what decides whether the jobs
  # of it do any work is `changes`, the first job below — the shape every other
  # workflow here uses, and the reason is written out in rust.yml.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A push supersedes the run it interrupts, so the older one is cancelled. A push
# to main is never cancelled — every commit of it is a release candidate and
# gets its own green or red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'

jobs:
  # Which of the files the two jobs below read this commit touched, and so
  # whether they have work to do. A skipped job answers the ruleset; a run that
  # never started does not, which is the difference rust.yml writes out at
  # length.
  changes:
    name: What changed (Demos)
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.paths.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff is against the base of the pull request, which is behind
          # the tip of the branch it was cut from.
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          .github/scripts/changed_paths.sh \
            'demo/**' \
            'crates/**' 'Cargo.toml' '**/Cargo.toml' 'Cargo.lock' '.cargo/**' \
            '.github/scripts/**' '.github/workflows/demo.yml'

  rust:
    name: demo (rust)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The demo is a package outside the workspace and so is a target
          # directory of its own; without this the action caches the workspace's
          # and recompiles the demo's from nothing on every run.
          work-directory: demo/rust
      # `cargo run` and not `cargo build`: the program writes six records and
      # reads them back out of the file it wrote, so a run that exits non-zero
      # is a demo whose output does not match what its own text promises. Its
      # `log/` is ignored by git.
      - name: cargo run
        working-directory: demo/rust
        run: cargo run

  c:
    name: demo (c)
    needs: changes
    if: needs.changes.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `make run` is `make` plus the program: the Makefile builds the FFI
      # archive of this checkout — `cargo build --release -p marsrs-ffi` — and
      # then links `demo.c` against it, so this job is also the one place the
      # C ABI is compiled *and called* from C rather than only from Rust. Both
      # `demo` and `log/` are ignored by git.
      - name: make run
        working-directory: demo/c
        run: make run
