[package]
name = "marsrs-compat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "CLI that encodes/decodes xlog files so the Rust port can be diffed against the C++ implementation"

[dependencies]
marsrs-core = { workspace = true }
marsrs-crypt = { workspace = true }
marsrs-buffer = { workspace = true }
# The reader: `decode` is `marsrs-xlog`'s, so the golden fixtures of `fixtures/`
# prove the very code the `xlog` CLI reads a `.xlog` with, and not a second
# copy of it. `flate2`, `zstd` and `k256` came with the reader and are gone
# with it — what is left here is the writer's side and the comparison itself.
marsrs-xlog = { workspace = true }
# The long-link and the short-link halves: `stn-compat` is the Rust of
# `mars/stn/proto/longlink_packer.cc` and of `shortlink_packer.cc`, so the same
# cross-read the fixtures of `fixtures/` are for can be run over the wire
# formats too. `marsrs-comm` is the http head the short link writes.
marsrs-stn = { workspace = true }
marsrs-comm = { workspace = true }
# The diagnosis half: `sdt-compat` is the Rust of the URL parser an HTTP check
# reads its own URL with, so the same cross-read can be run over `mars/sdt` too.
marsrs-sdt = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "xlog-compat"
path = "src/main.rs"

[[bin]]
name = "stn-compat"
path = "src/bin/stn.rs"

[[bin]]
name = "sdt-compat"
path = "src/bin/sdt.rs"

# The wire half: `comm-compat` is the Rust of `mars/comm/basepacker.cc` and of
# `mars/comm/adler32.c` — the long link's package before `longlink_packer.cc`
# took it over, and the hash over it.
[[bin]]
name = "comm-compat"
path = "src/bin/comm.rs"

[lints]
workspace = true
