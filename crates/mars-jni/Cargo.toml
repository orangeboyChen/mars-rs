[package]
name = "mars-jni"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "JNI bindings for the Rust port of Mars xlog (io.github.marsrs.xlog.Xlog)"

[lib]
# `libmarsxlog.so`, the name Xlog.java passes to System.loadLibrary.
crate-type = ["cdylib"]
name = "marsxlog"

[dependencies]
mars-appender = { workspace = true }
mars-comm = { workspace = true }
mars-sdt = { workspace = true }
mars-stn = { workspace = true }
jni = { workspace = true }
